function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function series(seed, length, scale){
  const rand = mulberry32(seed);
  const out = [];
  for(let i=0;i<length;i++) out.push((rand()-0.5)*2*scale);
  return out;
}

/* =========================================================================
   RISK / PORTFOLIO KPI FORMULAS — ported verbatim from the
   equitylens-risk-kpis skill.
   ========================================================================= */
function mean(arr){ return arr.reduce((a,b)=>a+b,0)/arr.length; }
function variance(arr, ddof=0){ const m=mean(arr); const sumSq=arr.reduce((a,b)=>a+(b-m)**2,0); return sumSq/(arr.length-ddof); }
function stdev(arr, ddof=0){ return Math.sqrt(variance(arr,ddof)); }
function covariance(a,b,ddof=0){ const ma=mean(a),mb=mean(b); let sum=0; for(let i=0;i<a.length;i++) sum+=(a[i]-ma)*(b[i]-mb); return sum/(a.length-ddof); }
function correlation(a,b){ return covariance(a,b)/(stdev(a)*stdev(b)); }
function normalPdf(z){ return (1/Math.sqrt(2*Math.PI))*Math.exp(-(z*z)/2); }
function portfolioReturnsFn(weights, returnsByTicker){
  const tickers = Object.keys(weights);
  const n = returnsByTicker[tickers[0]].length;
  const out = new Array(n).fill(0);
  for(let t=0;t<n;t++){ let r=0; for(const tk of tickers) r += weights[tk]*returnsByTicker[tk][t]; out[t]=r; }
  return out;
}
function sharpeRatio(dailyReturns, rfAnnual){
  const annReturn = mean(dailyReturns)*TRADING_DAYS_PER_YEAR;
  const annVol = stdev(dailyReturns)*Math.sqrt(TRADING_DAYS_PER_YEAR);
  return annVol>0 ? (annReturn-rfAnnual)/annVol : 0;
}
function downsideDeviation(dailyReturns, targetDaily=0){
  const sq = dailyReturns.map(r=>Math.min(0, r-targetDaily)**2);
  return Math.sqrt(mean(sq));
}
function sortinoRatio(dailyReturns, rfAnnual, targetDaily=0){
  const annReturn = mean(dailyReturns)*TRADING_DAYS_PER_YEAR;
  const annDownsideDev = downsideDeviation(dailyReturns, targetDaily)*Math.sqrt(TRADING_DAYS_PER_YEAR);
  return annDownsideDev>0 ? (annReturn-rfAnnual)/annDownsideDev : 0;
}
function treynorRatio(dailyReturns, rfAnnual, portfBeta){
  const annReturn = mean(dailyReturns)*TRADING_DAYS_PER_YEAR;
  return portfBeta!==0 ? (annReturn-rfAnnual)/portfBeta : 0;
}
function jensensAlpha(dailyReturns, benchmarkDailyReturns, rfAnnual, portfBeta){
  const annReturn = mean(dailyReturns)*TRADING_DAYS_PER_YEAR;
  const annBenchReturn = mean(benchmarkDailyReturns)*TRADING_DAYS_PER_YEAR;
  return annReturn - (rfAnnual + portfBeta*(annBenchReturn-rfAnnual));
}
function informationRatio(dailyReturns, benchmarkDailyReturns){
  const active = dailyReturns.map((r,i)=>r-benchmarkDailyReturns[i]);
  const annActiveReturn = mean(active)*TRADING_DAYS_PER_YEAR;
  const trackingError = stdev(active)*Math.sqrt(TRADING_DAYS_PER_YEAR);
  return trackingError>0 ? annActiveReturn/trackingError : 0;
}
function parametricVaR(portfolioValue, dailyReturns, confidence=0.95, horizonDays=1){
  const z = confidence===0.99 ? 2.326 : 1.645;
  const dailyVol = stdev(dailyReturns);
  const pct = z*dailyVol*Math.sqrt(horizonDays);
  return { pct, value: portfolioValue*pct };
}
function parametricCVaR(portfolioValue, dailyReturns, confidence=0.95, horizonDays=1){
  const z = confidence===0.99 ? 2.326 : 1.645;
  const alpha = 1-confidence;
  const dailyVol = stdev(dailyReturns);
  const pct = ((normalPdf(z)/alpha)*dailyVol)*Math.sqrt(horizonDays);
  return { pct, value: portfolioValue*pct };
}
function maxDrawdown(priceSeries){
  let runningMax=priceSeries[0], worst=0;
  for(const p of priceSeries){ runningMax=Math.max(runningMax,p); const dd=(p-runningMax)/runningMax; worst=Math.min(worst,dd); }
  return worst;
}
function betaOf(assetReturns, benchReturns){ return covariance(assetReturns,benchReturns)/variance(benchReturns); }
function portfolioBetaFn(weights, betasByTicker){ return Object.keys(weights).reduce((sum,tk)=>sum+weights[tk]*betasByTicker[tk],0); }
function rSquared(assetReturns, benchReturns){ return correlation(assetReturns,benchReturns)**2; }
function hhi(weights){ return Object.values(weights).reduce((s,w)=>s+w*w,0); }
function effectiveN(weights){ const h=hhi(weights); return h>0?1/h:0; }

/* =========================================================================
   TECHNICAL ANALYSIS & VALUATION-SCREEN FORMULAS —
   ported verbatim from the equitylens-technical-indicators skill.
   ========================================================================= */
function sma(prices, length){
  const out = new Array(prices.length).fill(null);
  let sum = 0;
  for (let i = 0; i < prices.length; i++) {
    sum += prices[i];
    if (i >= length) sum -= prices[i - length];
    if (i >= length - 1) out[i] = sum / length;
  }
  return out;
}
function ema(prices, length){
  const out = new Array(prices.length).fill(null);
  const k = 2/(length+1);
  let prev = null;
  for(let i=0;i<prices.length;i++){
    if(i===length-1){ let sum=0; for(let j=0;j<=i;j++) sum+=prices[j]; prev=sum/length; out[i]=prev; }
    else if(i>=length){ prev = prices[i]*k + prev*(1-k); out[i]=prev; }
  }
  return out;
}
function rsiFn(prices, length=14){
  const out = new Array(prices.length).fill(null);
  if(prices.length<=length) return out;
  let gains=0, losses=0;
  for(let i=1;i<=length;i++){ const chg=prices[i]-prices[i-1]; if(chg>=0) gains+=chg; else losses-=chg; }
  let avgGain=gains/length, avgLoss=losses/length;
  out[length] = avgLoss===0?100:100-100/(1+avgGain/avgLoss);
  for(let i=length+1;i<prices.length;i++){
    const chg=prices[i]-prices[i-1];
    const gain=chg>0?chg:0, loss=chg<0?-chg:0;
    avgGain=(avgGain*(length-1)+gain)/length;
    avgLoss=(avgLoss*(length-1)+loss)/length;
    out[i]=avgLoss===0?100:100-100/(1+avgGain/avgLoss);
  }
  return out;
}
function rateOfChange(prices, length){
  const n=prices.length;
  if(n<=length) return null;
  const past = prices[n-1-length];
  return past===0?null:(prices[n-1]-past)/past;
}
function analystConsensus(s){
  const sb=s.analystStrongBuy||0, b=s.analystBuy||0, h=s.analystHold||0, se=s.analystSell||0, ss=s.analystStrongSell||0;
  const total = sb+b+h+se+ss;
  const target = s.analystTargetPrice!=null ? s.analystTargetPrice : null;
  if(total===0 && target==null) return null;
  const score = total>0 ? (sb*2+b*1+h*0+se*-1+ss*-2)/total : null; // -2 (Strong Sell) .. +2 (Strong Buy)
  let label = "No rating data";
  if(score!=null){
    if(score>=1.2) label="Strong Buy";
    else if(score>=0.4) label="Buy";
    else if(score>-0.4) label="Hold";
    else if(score>-1.2) label="Sell";
    else label="Strong Sell";
  }
  const upside = (target!=null && s.price) ? (target-s.price)/s.price : null;
  return { sb,b,h,se,ss,total,label,target,upside };
}
function ratingClass(label){
  if(label==="Strong Buy"||label==="Buy") return "bullish";
  if(label==="Sell"||label==="Strong Sell") return "bearish";
  if(label==="Hold") return "fair";
  return "neutral";
}
function trendSignal(maShort, maLong, price){
  if(maShort==null||maLong==null) return "N/A";
  if(maShort>maLong && price>maShort) return "Bullish";
  if(maShort<maLong && price<maShort) return "Bearish";
  return "Neutral";
}
function fibonacciRetracement(prices, lookback){
  const window = prices.slice(-lookback);
  const high = Math.max(...window), low = Math.min(...window);
  const diff = high-low;
  const uptrend = window[window.length-1] >= window[0];
  const ratios = [0,0.236,0.382,0.5,0.618,0.786,1];
  const levels = {};
  ratios.forEach(r=>{ levels[r] = uptrend ? high-diff*r : low+diff*r; });
  return { high, low, uptrend, levels };
}
function impliedPeSeries(priceSeries, eps){
  if(!eps || eps<=0) return priceSeries.map(()=>null);
  return priceSeries.map(p=>p/eps);
}
function percentileRank(series, value){
  const valid = series.filter(x=>x!=null && !isNaN(x));
  if(valid.length===0) return null;
  const below = valid.filter(x=>x<=value).length;
  return below/valid.length;
}
function valuationTag(percentile){
  if(percentile==null) return "N/A";
  if(percentile<=0.25) return "Cheap vs. history";
  if(percentile>=0.75) return "Expensive vs. history";
  return "Fair vs. history";
}
function momentumScore(prices){
  const roc20 = rateOfChange(prices,20);
  const roc60 = rateOfChange(prices, Math.min(60, prices.length-1));
  const rsiSeries = rsiFn(prices,14);
  const latestRsi = rsiSeries[rsiSeries.length-1];
  if(roc20==null && roc60==null && latestRsi==null) return null;
  const rocComponent = ((roc20||0)+(roc60||0))/2;
  const rsiComponent = latestRsi!=null ? (latestRsi-50)/50 : 0;
  return rocComponent*0.7 + rsiComponent*0.3;
}

   correlation flags, style box, composite score, Monte Carlo, empirical VaR.

// --- Scenario stress testing: shock the benchmark, propagate via existing betas ---
const STRESS_SCENARIOS = [
  { key:"gfc2008",       label:"2008 Financial Crisis (-38%)",      shock:-0.38 },
  { key:"covid2020",     label:"2020 COVID Crash (-34%)",           shock:-0.34 },
  { key:"ratesock2022",  label:"2022 Rate-Driven Selloff (-25%)",   shock:-0.25 },
  { key:"correction",    label:"Standard Correction (-10%)",        shock:-0.10 },
  { key:"rally",         label:"Strong Rally (+15%)",                shock:0.15 },
];
// Factor-based stress testing: overrides the normal covariance assumptions
// behind parametric VaR with one deterministic market move, propagated through
// each position's beta. Idiosyncratic (stock-specific) risk isn't modeled in
// a scenario shock — that's the standard simplification this approach makes.
function scenarioImpact(positions, weights, totalValue, shockPct){
  let deltaValue = 0;
  const byPosition = positions.map(p=>{
    const beta = STOCK_BETA[p.ticker] ?? 1;
    const posReturn = beta * shockPct;
    const posDelta = p.value * posReturn;
    deltaValue += posDelta;
    return { ticker:p.ticker, beta, posReturn, posDelta };
  }).sort((a,b)=>a.posDelta-b.posDelta);
  return { totalValue, deltaValue, newValue: totalValue+deltaValue, pctImpact: totalValue>0?deltaValue/totalValue:0, byPosition };
}

// --- Rebalancing: drift from a user-set target weight, suggested trade to close it ---
function rebalanceSuggestion(currentWeight, targetWeight, totalValue){
  const drift = (currentWeight??0) - (targetWeight??currentWeight??0);
  const targetValue = (targetWeight??currentWeight??0) * totalValue;
  const currentValue = (currentWeight??0) * totalValue;
  return { drift, tradeValue: targetValue - currentValue }; // positive = buy, negative = sell
}

// --- Concentration & correlation risk flags ---
function concentrationFlags(positions, weights, opts={}){
  const posThreshold = opts.posThreshold ?? 0.20;
  const sectorThreshold = opts.sectorThreshold ?? 0.35;
  const corrThreshold = opts.corrThreshold ?? 0.70;
  const flags = [];
  positions.forEach(p=>{
    const w = weights[p.ticker]||0;
    if(w >= posThreshold) flags.push({ level:"warn", text:`${p.ticker} is ${fmtPlain(w)} of the portfolio — above the ${fmtPlain(posThreshold,0)} single-position threshold.` });
  });
  const sectorMap = {};
  positions.forEach(p=>{ const sec=p.sector||"Unknown"; sectorMap[sec]=(sectorMap[sec]||0)+(weights[p.ticker]||0); });
  Object.entries(sectorMap).forEach(([sec,w])=>{
    if(w >= sectorThreshold) flags.push({ level:"warn", text:`${escapeHtml(sec)} sector is ${fmtPlain(w)} of the portfolio — above the ${fmtPlain(sectorThreshold,0)} sector threshold.` });
  });
  const tickers = positions.map(p=>p.ticker);
  for(let i=0;i<tickers.length;i++){
    for(let j=i+1;j<tickers.length;j++){
      const t1=tickers[i], t2=tickers[j];
      if(!RETURNS[t1]||!RETURNS[t2]) continue;
      const c = correlation(RETURNS[t1],RETURNS[t2]);
      if(c >= corrThreshold){
        const combined = (weights[t1]||0)+(weights[t2]||0);
        flags.push({ level:"info", text:`${t1} and ${t2} correlate at ${fmtNum(c,2)} (combined ${fmtPlain(combined)} of NAV) — moves together, not true diversification.` });
      }
    }
  }
  if(flags.length===0) flags.push({ level:"ok", text:"No concentration or correlation flags at current thresholds." });
  return flags;
}

// --- Liquidity: days to liquidate a position at its average daily volume ---
function daysToLiquidate(shares, avgVolumeM){
  if(!avgVolumeM || avgVolumeM<=0) return null;
  return shares / (avgVolumeM*1e6);
}
// Assumes only 20% of a day's average volume can be sold without moving the
// price — a standard rule-of-thumb liquidity constraint, not a hard limit.
function liquidityFlags(positions, opts={}){
  const dayThreshold = opts.dayThreshold ?? 1;
  const participationRate = opts.participationRate ?? 0.20;
  const flags = [];
  positions.forEach(p=>{
    const rawDays = daysToLiquidate(p.shares, p.avgVolume);
    if(rawDays==null) return;
    const days = rawDays/participationRate;
    if(days >= dayThreshold){
      flags.push({ level:"info", text:`${p.ticker}: ~${fmtNum(days,1)} trading days to exit at 20% of average daily volume (${fmtNum(p.avgVolume,1)}M shares/day) without materially moving the price.` });
    }
  });
  return flags;
}

// --- Style box: size (market cap) x style (P/E percentile as a value/growth proxy) ---
function sizeBucket(marketCap){
  if(marketCap==null) return "Mid"; // ETFs / unknown default to the middle bucket
  if(marketCap >= 200e9) return "Large";
  if(marketCap >= 10e9) return "Mid";
  return "Small";
}
function styleBucketOf(pePctl){
  if(pePctl==null) return "Blend";
  if(pePctl <= 0.33) return "Value";
  if(pePctl >= 0.67) return "Growth";
  return "Blend";
}
function styleBoxWeights(positions, weights){
  const sizes=["Large","Mid","Small"], styles=["Value","Blend","Growth"];
  const grid = {};
  sizes.forEach(sz=>styles.forEach(st=>grid[`${sz}/${st}`]=0));
  positions.forEach(p=>{
    const sz = sizeBucket(p.marketCap);
    const st = styleBucketOf(STOCK_PE_PCTL[p.ticker]);
    grid[`${sz}/${st}`] += weights[p.ticker]||0;
  });
  return grid;
}

// --- Composite score: blends already-computed percentiles into one 0-100 signal,
//     same idea as Simply Wall St's Snowflake / Seeking Alpha's Quant Rating. ---
function compositeScore(t){
  const s = UNIVERSE[t];
  const parts = [];
  if(STOCK_PE_PCTL[t]!=null) parts.push({ w:0.30, v:(1-STOCK_PE_PCTL[t])*100 });          // cheap vs. history -> high score
  if(STOCK_MOM[t]!=null) parts.push({ w:0.30, v:Math.max(0,Math.min(100,(STOCK_MOM[t]+0.5)*100)) }); // momentum
  if(s.roe!=null) parts.push({ w:0.20, v:Math.max(0,Math.min(100,(s.roe/0.30)*100)) });    // quality (ROE)
  if(s.revGrowth!=null) parts.push({ w:0.20, v:Math.max(0,Math.min(100,(s.revGrowth/0.30)*100)) }); // growth
  if(parts.length===0) return null;
  const totalW = parts.reduce((a,p)=>a+p.w,0);
  return Math.round(parts.reduce((a,p)=>a+p.w*p.v,0)/totalW);
}
function compositeScoreBreakdown(t){
  const s = UNIVERSE[t];
  return {
    valuation: STOCK_PE_PCTL[t]!=null ? Math.round((1-STOCK_PE_PCTL[t])*100) : null,
    momentum: STOCK_MOM[t]!=null ? Math.round(Math.max(0,Math.min(100,(STOCK_MOM[t]+0.5)*100))) : null,
    quality: s.roe!=null ? Math.round(Math.max(0,Math.min(100,(s.roe/0.30)*100))) : null,
    growth: s.revGrowth!=null ? Math.round(Math.max(0,Math.min(100,(s.revGrowth/0.30)*100))) : null,
  };
}
function scoreClass(score){
  if(score==null) return "neutral";
  if(score>=65) return "bullish";
  if(score<=35) return "bearish";
  return "fair";
}

// --- Monte Carlo: GBM forward simulation of portfolio value, sampled at checkpoints ---
function monteCarloFanSeries(startValue, annReturn, annVol, horizonDays, numPaths, checkpoints, seed=42){
  const rand = mulberry32(seed);
  const dt = 1/TRADING_DAYS_PER_YEAR;
  const drift = (annReturn - 0.5*annVol*annVol) * dt;
  const vol = annVol * Math.sqrt(dt);
  const series = checkpoints.map(()=>[]);
  for(let p=0; p<numPaths; p++){
    let v = startValue; let ci = 0;
    for(let d=1; d<=horizonDays; d++){
      const u1 = Math.max(rand(), 1e-9), u2 = rand();
      const z = Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2); // Box-Muller standard normal
      v = v * Math.exp(drift + vol*z);
      if(ci<checkpoints.length && d===checkpoints[ci]){ series[ci].push(v); ci++; }
    }
  }
  const pct = (arr,q) => { const s=[...arr].sort((a,b)=>a-b); return s.length?s[Math.min(s.length-1,Math.max(0,Math.round(q*(s.length-1))))]:startValue; };
  return checkpoints.map((day,i)=>({ day, p05:pct(series[i],0.05), p25:pct(series[i],0.25), p50:pct(series[i],0.50), p75:pct(series[i],0.75), p95:pct(series[i],0.95) }));
}

// --- Empirical (historical-simulation) VaR/CVaR — doesn't assume normal returns,
//     a natural pairing with the parametric version already in the risk-kpis skill. ---
function empiricalVaR(portfolioValue, dailyReturns, confidence=0.95){
  const sorted = [...dailyReturns].sort((a,b)=>a-b);
  const idx = Math.max(0, Math.floor((1-confidence)*sorted.length)-1);
  const pct = Math.abs(Math.min(0, sorted[idx] ?? 0));
  return { pct, value: portfolioValue*pct };
}
function empiricalCVaR(portfolioValue, dailyReturns, confidence=0.95){
  const sorted = [...dailyReturns].sort((a,b)=>a-b);
  const cutoff = Math.max(1, Math.floor((1-confidence)*sorted.length));
  const tail = sorted.slice(0, cutoff);
  const pct = Math.abs(Math.min(0, tail.length?mean(tail):0));
  return { pct, value: portfolioValue*pct };
}

// --- Unrealized P&L (now that avgCost is tracked per position via Excel import) ---
function unrealizedPnL(shares, avgCost, price){
  if(avgCost==null || price==null) return { dollar:null, pct:null };
  return { dollar: shares*(price-avgCost), pct: avgCost>0 ? (price-avgCost)/avgCost : null };
}

// --- Dividend income: prefers real trailing-12mo history (DIVIDENDS endpoint,
//     opt-in on refresh), falls back to current-yield x price when unavailable ---
function trailingDividendPerShare(ticker){
  const d = DIVIDENDS[ticker];
  if(d && d.history && d.history.length){
    const oneYearAgo = new Date(); oneYearAgo.setFullYear(oneYearAgo.getFullYear()-1);
    const recent = d.history.filter(h=>{ const dt=new Date(h.exDate); return !isNaN(dt) && dt >= oneYearAgo; });
    const sum = recent.reduce((a,h)=>a+(h.amount||0),0);
    if(sum>0) return { perShare: sum, source:"history" };
  }
  const s = UNIVERSE[ticker];
  if(s && s.divYield && s.price) return { perShare: s.divYield*s.price, source:"yield" };
  return { perShare:0, source:"none" };
}
function portfolioDividendIncome(positions){
  let annualIncome=0;
  const rows = positions.map(p=>{
    const info = trailingDividendPerShare(p.ticker);
    const income = p.shares*info.perShare;
    annualIncome += income;
    return { ticker:p.ticker, perShare:info.perShare, source:info.source, income };
  }).filter(r=>r.income>0).sort((a,b)=>b.income-a.income);
  return { annualIncome, rows };
}

// Precompute per-stock stats (recomputed whenever live data lands)
const STOCK_BETA={}, STOCK_SHARPE={}, STOCK_ANNVOL={}, STOCK_ANNRET={}, STOCK_MAXDD={}, STOCK_RSQ={};
const STOCK_RSI={}, STOCK_ROC20={}, STOCK_ROC60={}, STOCK_TREND={}, STOCK_MOM={}, STOCK_PE_PCTL={}, STOCK_VAL_TAG={};
function recomputeStockStats(){
  TICKERS.forEach(t=>{
    STOCK_BETA[t]=betaOf(RETURNS[t],BENCH_RETURNS);
    STOCK_SHARPE[t]=sharpeRatio(RETURNS[t],RF);
    STOCK_ANNVOL[t]=stdev(RETURNS[t])*Math.sqrt(TRADING_DAYS_PER_YEAR);
    STOCK_ANNRET[t]=mean(RETURNS[t])*TRADING_DAYS_PER_YEAR;
    STOCK_MAXDD[t]=maxDrawdown(PRICES[t]);
    STOCK_RSQ[t]=rSquared(RETURNS[t],BENCH_RETURNS);

    const pf = PRICES_FULL[t];
    const rsiSeries = rsiFn(pf,14);
    STOCK_RSI[t] = rsiSeries[rsiSeries.length-1];
    STOCK_ROC20[t] = rateOfChange(pf,20);
    STOCK_ROC60[t] = rateOfChange(pf, Math.min(60, pf.length-1));
    const s20 = sma(pf,20), s50 = sma(pf,50);
    STOCK_TREND[t] = trendSignal(s20[s20.length-1], s50[s50.length-1], pf[pf.length-1]);
    STOCK_MOM[t] = momentumScore(pf);
    const eps = UNIVERSE[t].eps || (UNIVERSE[t].pe ? UNIVERSE[t].price/UNIVERSE[t].pe : null);
    const peSeries = impliedPeSeries(pf, eps);
    const pctl = UNIVERSE[t].pe!=null ? percentileRank(peSeries, UNIVERSE[t].pe) : null;
    STOCK_PE_PCTL[t] = pctl;
    STOCK_VAL_TAG[t] = valuationTag(pctl);
  });
}

// HTML-escape any string before it goes into an innerHTML template literal.
// Defense in depth: server.js now rejects/sanitizes unsafe import fields at the
// source, but names/sectors can also come from Alpha Vantage (external data),
// so every non-numeric, potentially-external-or-imported string gets escaped
// at render time too rather than trusting upstream sanitization alone.
const escapeHtml = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const fmtMoney = n => n==null ? "—" : "$"+Math.round(n).toLocaleString();
const fmtMoneyB = n => n==null ? "—" : "$"+n.toFixed(1)+"B";
const fmtPct = (n,d=2) => n==null ? "—" : (n>=0?"+":"")+(n*100).toFixed(d)+"%";
const fmtPlain = (n,d=1) => n==null ? "—" : (n*100).toFixed(d)+"%";
const fmtNum = (n,d=2) => n==null||isNaN(n) ? "—" : n.toFixed(d);
const cls = n => n>=0 ? "up" : "down";
const arrow = n => n>=0 ? "▲" : "▼";
function tagClass(tag){
  if(tag==="Bullish"||tag==="Cheap vs. history") return "bullish";
  if(tag==="Bearish"||tag==="Expensive vs. history") return "bearish";
  if(tag==="Fair vs. history") return "fair";
  return "neutral";
}

function getPositions(){
  return Object.keys(state.portfolio)
    .filter(t=>state.portfolio[t]>0 && UNIVERSE[t])
    .map(t=>{
      const s=UNIVERSE[t]; const shares=state.portfolio[t];
      const meta = POSITION_META[t] || { avgCost:s.price, currency:"USD", market:"US", purchaseDate:null };
      const price = s.price || meta.avgCost || 0;
      const fx = meta.currency==="USD" ? 1 : (FX_RATES[meta.currency] ?? null);
      const fxKnown = meta.currency==="USD" || fx!=null;
      const value = shares*price*(fx ?? 1);
      return {ticker:t,...s,shares,value,avgCost:meta.avgCost,currency:meta.currency,market:meta.market,purchaseDate:meta.purchaseDate,fxKnown};
    })
    .sort((a,b)=>b.value-a.value);
}
function getWeights(positions,totalValue){
  const w={}; positions.forEach(p=>w[p.ticker]=p.value/(totalValue||1)); return w;
}
function computeRisk(weights, totalValue){
  if(totalValue<=0 || Object.keys(weights).length===0) return null;
  const portRet = portfolioReturnsFn(weights, RETURNS);
  const annReturn = mean(portRet)*TRADING_DAYS_PER_YEAR;
  const annVol = stdev(portRet)*Math.sqrt(TRADING_DAYS_PER_YEAR);
  const sharpe = sharpeRatio(portRet, RF);
  const sortino = sortinoRatio(portRet, RF);
  const pBeta = portfolioBetaFn(weights, STOCK_BETA);
  const treynor = treynorRatio(portRet, RF, pBeta);
  const alpha = jensensAlpha(portRet, BENCH_RETURNS, RF, pBeta);
  const ir = informationRatio(portRet, BENCH_RETURNS);
  const rsq = rSquared(portRet, BENCH_RETURNS);
  const var1d = parametricVaR(totalValue, portRet, 0.95, 1);
  const var1m = parametricVaR(totalValue, portRet, 0.95, 21);
  const cvar1d = parametricCVaR(totalValue, portRet, 0.95, 1);
  const priceIdx = [1000]; portRet.forEach(r=>priceIdx.push(priceIdx[priceIdx.length-1]*(1+r)));
  const mdd = maxDrawdown(priceIdx);
  const h = hhi(weights), effN = effectiveN(weights);
  return { portRet, annReturn, annVol, sharpe, sortino, beta:pBeta, treynor, alpha, ir, rsq, var1d, var1m, cvar1d, mdd, hhi:h, effN };
}

      <div class="table-card" style="padding:18px 20px;display:flex;flex-direction:column;gap:12px;">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;">

            <div class="stat-label">Target Price</div>

              `<div style="width:${(consensus[k]/consensus.total*100).toFixed(1)}%;background:${color};"></div>`).join("")}
          </div>
          <div class="mono" style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:6px;">
            <span>${consensus.sb} Strong Buy</span><span>${consensus.b} Buy</span><span>${consensus.h} Hold</span><span>${consensus.se} Sell</span><span>${consensus.ss} Strong Sell</span>

          <div style="display:flex;flex-direction:column;gap:8px;">${ns.headlines.map(h=>`<div style="font-size:11.5px;line-height:1.4;"><span style="color:var(--muted);">${escapeHtml(h.source)}</span> — ${escapeHtml(h.title)}</div>`).join("")}</div>

      <div class="section-label">Fundamentals</div>
      <div class="summary-grid summary-grid-4">
        <div class="stat-card"><div class="stat-label">P/E</div><div class="stat-value small">${fmtNum(s.pe,1)}</div><div class="stat-sub">${s.dataSource==="live"?"live (OVERVIEW)":"trailing (mock)"}</div></div>

        <div class="stat-card"><div class="stat-label">Debt/Equity</div><div class="stat-value small">${s.debtEquity ?? "—"}</div><div class="stat-sub">${s.dataSource==="live"?"needs BALANCE_SHEET call — not pulled":"latest FY (mock)"}</div></div>
        <div class="stat-card"><div class="stat-label">ROE</div><div class="stat-value small">${s.roe?fmtPlain(s.roe):"—"}</div><div class="stat-sub">trailing 12mo</div></div>
        <div class="stat-card"><div class="stat-label">Revenue Growth</div><div class="stat-value small">${s.revGrowth?fmtPlain(s.revGrowth):"—"}</div><div class="stat-sub">YoY</div></div>
        <div class="stat-card"><div class="stat-label">EBITDA Margin</div><div class="stat-value small">${s.ebitdaMargin?fmtPlain(s.ebitdaMargin):"—"}</div><div class="stat-sub">latest FY</div></div>
        <div class="stat-card"><div class="stat-label">Free Cash Flow</div><div class="stat-value small">${s.fcf?fmtMoneyB(s.fcf):"—"}</div><div class="stat-sub">${s.dataSource==="live"?"needs CASH_FLOW call — not pulled":"TTM (mock)"}</div></div>
        <div class="stat-card"><div class="stat-label">Avg Daily Volume</div><div class="stat-value small">${fmtNum(s.avgVolume,1)}M</div><div class="stat-sub">${escapeHtml(s.assetClass)} · ${escapeHtml(s.sector)||"—"}</div></div>
      </div>

    <div class="footnote">Jump to any ticker via the search bar on Dashboard, the selector above, the Screener, or a row in Portfolio &amp; Risk / Comparison. P/E percentile compares current P/E to a ${s.dataSource==="live"?"same-EPS implied historical series (real prices, approximated constant EPS)":"same-EPS implied historical series (mock)"} — see the technical-indicators skill for the real EARNINGS-based upgrade path.</div>
  </div>`;
}

/* =========================================================================
   VIEW: PORTFOLIO & RISK
   ========================================================================= */
function viewPortfolio(){
  const positions=getPositions();
  const totalValue=positions.reduce((a,p)=>a+p.value,0);
  const weights=getWeights(positions,totalValue);
  const risk=computeRisk(weights,totalValue);
  const dayChangeVal=positions.reduce((a,p)=>{ const pf=PRICES_FULL[p.ticker]; const chg=(pf[pf.length-1]-pf[pf.length-2])/pf[pf.length-2]; return a+p.value*chg; },0);
  const dayChangePct=totalValue>0?dayChangeVal/totalValue:0;

  const sectorMap={};
  positions.forEach(p=>{ const sec=p.sector||"Unknown"; sectorMap[sec]=(sectorMap[sec]||0)+p.value; });

  let flags = concentrationFlags(positions, weights).filter(f=>f.level!=="ok");
  flags = flags.concat(liquidityFlags(positions));
  if(flags.length===0) flags = [{ level:"ok", text:"No concentration, correlation, or liquidity flags at current thresholds." }];
  const empVar = risk ? empiricalVaR(totalValue, risk.portRet, 0.95) : null;
  const empCvar = risk ? empiricalCVaR(totalValue, risk.portRet, 0.95) : null;
  const scenario = STRESS_SCENARIOS.find(s=>s.key===state.stressScenario) || STRESS_SCENARIOS[0];
  const stress = risk ? scenarioImpact(positions, weights, totalValue, scenario.shock) : null;
  const styleGrid = styleBoxWeights(positions, weights);
  const sizes=["Large","Mid","Small"], styles=["Value","Blend","Growth"];

  return `
  <div class="topbar">
    <div>
      <div class="page-heading">Portfolio &amp; Risk</div>
      <div class="page-sub">${positions.length} positions · rf = 3M T-bill (4.3%) · benchmark ${BENCHMARK_NAME}</div>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="secondary-btn" id="openImportModal">⇪ Import Portfolio</button>
      <button class="primary-btn" id="openAddModal">+ Add Stock</button>
    </div>
  </div>
  <div class="content">
    <div>
      <div class="section-label">Risk Summary</div>
      <div class="summary-grid summary-grid-5">
        <div class="stat-card hero"><div class="stat-label">Total Value</div><div class="stat-value">${fmtMoney(totalValue)}</div><div class="stat-sub ${cls(dayChangeVal)}">${arrow(dayChangeVal)} ${fmtMoney(Math.abs(dayChangeVal))} (${fmtPct(dayChangePct)}) today</div></div>
        <div class="stat-card"><div class="stat-label">Sharpe / Sortino</div><div class="stat-value">${risk?`${fmtNum(risk.sharpe)} / ${fmtNum(risk.sortino)}`:"—"}</div><div class="stat-sub">rf = 4.3%</div></div>
        <div class="stat-card"><div class="stat-label">Beta / Treynor</div><div class="stat-value">${risk?`${fmtNum(risk.beta)} / ${fmtNum(risk.treynor)}`:"—"}</div><div class="stat-sub">Jensen's α ${risk?fmtPct(risk.alpha):"—"}</div></div>
        <div class="stat-card"><div class="stat-label">Info Ratio / R²</div><div class="stat-value">${risk?`${fmtNum(risk.ir)} / ${fmtNum(risk.rsq)}`:"—"}</div><div class="stat-sub">Ann. vol ${risk?fmtPlain(risk.annVol):"—"}</div></div>
        <div class="stat-card"><div class="stat-label">95% VaR (1-day)</div><div class="stat-value" style="color:var(--red);">${risk?"-"+fmtMoney(risk.var1d.value):"—"}</div><div class="stat-sub">-${risk?fmtPlain(risk.var1d.pct):"—"} of NAV</div></div>
      </div>
    </div>

    <div>
      <div class="section-label">Risk Flags — concentration &amp; correlation</div>
      <div class="flag-row">
        ${flags.map(f=>`<div class="flag flag-${f.level}">${f.text}</div>`).join("")}
      </div>
    </div>

    <div class="risk-grid">
      <div>
        <div class="section-label">Holdings &amp; Rebalancing <span style="font-weight:400;font-style:italic;color:var(--muted);text-transform:none;letter-spacing:0;">— set a target % to track drift</span></div>
        <div class="table-card">
          ${positions.length===0 ? `<div style="padding:24px;font-size:13px;color:var(--muted);">No positions yet. Click "+ Add Stock" to build a portfolio.</div>` : `
          <table>
            <thead><tr><th>Ticker</th><th>Market</th><th class="num">Shares</th><th class="num">Avg Cost</th><th class="num">Price</th><th class="num">Mkt Value (USD)</th><th class="num">Weight</th><th class="num">Unrealized G/L</th><th class="num">Target %</th><th class="num">Drift</th><th class="num">Day Chg</th><th class="num">Beta</th><th></th></tr></thead>
            <tbody>
            ${positions.map(p=>{
              const pf=PRICES_FULL[p.ticker]; const chg=(pf[pf.length-1]-pf[pf.length-2])/pf[pf.length-2];
              const ccyTag = p.currency && p.currency!=="USD" ? ` <span class="mono" style="font-size:9.5px;color:var(--muted);">${p.currency}${!p.fxKnown?" ⚠":""}</span>` : "";
              const pnl = unrealizedPnL(p.shares, p.avgCost, p.price);
              const targetPct = state.targetWeights[p.ticker];
              const targetInputVal = targetPct!=null ? (targetPct*100).toFixed(1) : "";
              const reb = rebalanceSuggestion(weights[p.ticker], targetPct, totalValue);
              const hasTarget = targetPct!=null;
              return `<tr>
                <td class="name-cell" data-open="${p.ticker}" style="cursor:pointer;"><span class="ticker-tag">${p.ticker}</span> <span class="src-pill ${p.dataSource}">${p.dataSource}</span><br><span class="co-name">${escapeHtml(p.name)}</span></td>
                <td><span class="sector-pill">${p.market||"US"}</span></td>
                <td class="num"><div class="stepper"><button data-step="${p.ticker}" data-delta="-10">−</button>${p.shares.toLocaleString()}<button data-step="${p.ticker}" data-delta="10">+</button></div></td>
                <td class="num">${p.avgCost!=null?p.avgCost.toFixed(2):"—"}${ccyTag}</td>
                <td class="num">${p.price!=null?p.price.toFixed(2):"—"}</td>
                <td class="num">${Math.round(p.value).toLocaleString()}</td>
                <td class="num">${fmtPlain(weights[p.ticker])}</td>
                <td class="num ${pnl.dollar!=null?cls(pnl.dollar):''}">${pnl.dollar!=null?fmtMoney(pnl.dollar)+" ("+fmtPct(pnl.pct)+")":"—"}</td>
                <td class="num"><input class="target-input" data-target="${p.ticker}" type="number" min="0" max="100" step="0.5" placeholder="—" value="${targetInputVal}"></td>
                <td class="num ${hasTarget?(Math.abs(reb.drift)>=0.03?'down':''):''}">${hasTarget?fmtPct(reb.drift):"—"}</td>
                <td class="num ${cls(chg)}">${fmtPct(chg)}</td>
                <td class="num">${fmtNum(STOCK_BETA[p.ticker])}</td>
                <td class="num"><button class="remove-btn" data-remove="${p.ticker}">✕</button></td>
              </tr>`;
            }).join("")}
            </tbody>
          </table>`}
        </div>
        <div class="footnote" style="margin-top:8px;">Weight = market value / total portfolio value. Unrealized G/L uses cost basis from manual entry or Excel import. Target % is optional per position — drift = current weight − target; |drift| ≥ 3% is flagged red. Non-USD positions convert at the last-fetched spot FX rate (⚠ = rate not yet available).</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div class="table-card" style="padding:18px;">
          <div class="section-label">Sector Allocation</div>
          <canvas id="chartSector" height="200"></canvas>
        </div>
        <div class="table-card" style="padding:18px;">
          <div class="section-label">Style Box <span style="font-weight:400;font-style:italic;color:var(--muted);text-transform:none;letter-spacing:0;">size × valuation tilt</span></div>
          <div style="display:grid;grid-template-columns:56px repeat(3,1fr);gap:4px;">
            <div></div>
            ${styles.map(st=>`<div class="mono" style="text-align:center;font-size:10px;color:var(--muted);">${st}</div>`).join("")}
            ${sizes.map(sz=>`
              <div class="mono" style="font-size:10px;color:var(--muted);align-self:center;">${sz}</div>
              ${styles.map(st=>{
                const w = styleGrid[`${sz}/${st}`]||0;
                const intensity = Math.min(0.85, 0.08+w*2.2);
                return `<div class="heat-cell" style="background:rgba(15,76,129,${intensity});">${w>0?fmtPlain(w,0):"—"}</div>`;
              }).join("")}
            `).join("")}
          </div>
          <div class="footnote" style="margin-top:8px;">Size from market cap (Large ≥$200B, Mid ≥$10B); style from P/E-vs-history percentile (cheap third = Value, expensive third = Growth). ETFs default to Mid/Blend.</div>
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:14px;">
      <div class="stat-card">
        <div class="section-label" style="margin-bottom:10px;">Value at Risk, 95% — Parametric vs. Empirical</div>
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="color:var(--muted);font-size:12px;">1-day VaR (parametric)</span><span class="stat-value small" style="color:var(--red);">${risk?"-"+fmtMoney(risk.var1d.value):"—"}</span></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="color:var(--muted);font-size:12px;">1-day VaR (empirical)</span><span class="stat-value small" style="color:var(--red);">${empVar?"-"+fmtMoney(empVar.value):"—"}</span></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="color:var(--muted);font-size:12px;">1-day CVaR (parametric)</span><span class="stat-value small" style="color:var(--red);">${risk?"-"+fmtMoney(risk.cvar1d.value):"—"}</span></div>
        <div style="display:flex;justify-content:space-between;"><span style="color:var(--muted);font-size:12px;">1-day CVaR (empirical)</span><span class="stat-value small" style="color:var(--red);">${empCvar?"-"+fmtMoney(empCvar.value):"—"}</span></div>
        <div class="footnote" style="margin-top:10px;">Parametric assumes normal returns; empirical (historical-simulation) sorts the actual trailing ${RISK_WINDOW}-day returns and reads the 5th percentile directly — no distribution assumption, but noisier with a short window.</div>
      </div>
      <div class="stat-card">
        <div class="section-label" style="margin-bottom:10px;">Diversification</div>
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="color:var(--muted);font-size:12px;">HHI</span><span class="stat-value small">${risk?fmtNum(risk.hhi,3):"—"}</span></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="color:var(--muted);font-size:12px;">Effective N</span><span class="stat-value small">${risk?fmtNum(risk.effN,1):"—"}</span></div>
        <div style="display:flex;justify-content:space-between;"><span style="color:var(--muted);font-size:12px;">Max Drawdown</span><span class="stat-value small" style="color:var(--red);">${risk?fmtPct(risk.mdd):"—"}</span></div>
        <div class="footnote" style="margin-top:10px;">Effective N of ${risk?fmtNum(risk.effN,1):"—"} vs. ${positions.length} actual holdings ${risk && risk.effN < positions.length*0.7 ? "indicates meaningful concentration.":"is reasonably close to even weighting."}</div>
      </div>
      <div class="stat-card">
        <div class="section-label" style="margin-bottom:10px;">Correlation Matrix (daily returns, ${RISK_WINDOW}d)</div>
        <div id="corrMatrix"></div>
      </div>
    </div>

    <div class="risk-grid">
      <div class="table-card" style="padding:20px;">
        <div class="section-label">Scenario Stress Test <span style="font-weight:400;font-style:italic;color:var(--muted);text-transform:none;letter-spacing:0;">factor-based: shocks the benchmark, propagates via each position's beta</span></div>
        <select id="scenarioSelect" class="mono" style="padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);margin-bottom:14px;">
          ${STRESS_SCENARIOS.map(s=>`<option value="${s.key}" ${s.key===scenario.key?'selected':''}>${s.label}</option>`).join("")}
        </select>
        ${stress ? `
        <div style="display:flex;gap:18px;margin-bottom:14px;">
          <div><div class="stat-label">Portfolio Impact</div><div class="stat-value ${cls(stress.deltaValue)}">${fmtMoney(stress.deltaValue)} (${fmtPct(stress.pctImpact)})</div></div>
          <div><div class="stat-label">Value After Shock</div><div class="stat-value small">${fmtMoney(stress.newValue)}</div></div>
        </div>
        <div style="max-height:180px;overflow-y:auto;">
          <table><thead><tr><th>Ticker</th><th class="num">Beta</th><th class="num">Scenario Return</th><th class="num">Δ Value</th></tr></thead>
          <tbody>${stress.byPosition.map(b=>`<tr><td class="ticker-tag">${b.ticker}</td><td class="num">${fmtNum(b.beta)}</td><td class="num ${cls(b.posReturn)}">${fmtPct(b.posReturn)}</td><td class="num ${cls(b.posDelta)}">${fmtMoney(b.posDelta)}</td></tr>`).join("")}</tbody></table>
        </div>
        <div class="footnote" style="margin-top:10px;">Standard factor-based stress testing simplification: overrides normal covariance assumptions with one deterministic market move, applied through each position's own beta. Idiosyncratic (stock-specific) risk isn't modeled in a scenario shock.</div>` : `<div class="footnote">No positions to stress test.</div>`}

function screenerRows(){

function viewScreener(){
  let rows = screenerRows();
  const { col, dir } = state.screenerSort;
  rows.sort((a,b)=>{
    let va=a[col], vb=b[col];

  return `

      RoC = rate of change (price momentum) over the trailing window, computed from each ticker's full available history (up to ${MOCK_DAYS} sessions mock / ~100 live).

}

// Expected columns (header names matched case-insensitively, with aliases):
//   Stock Name / Ticker / Symbol   — required
//   Market (US, EU, etc.)          — optional, defaults to "US"
//   Quantity / Shares              — required
//   Bought Price / Avg Cost        — required
//   Currency                       — optional, defaults to "USD"
//   Purchase Date                  — optional
const IMPORT_COL_ALIASES = {
  symbol: ["stock name","stock","ticker","symbol","name"],
  market: ["market","exchange","region"],
  quantity: ["quantity","shares","qty"],
  boughtPrice: ["bought price","avg cost","purchase price","cost","price paid"],
  currency: ["currency","ccy"],
  purchaseDate: ["purchase date","date","bought date","date purchased"],
};
function matchColumn(header, field){
  const h = String(header||"").trim().toLowerCase();
  return IMPORT_COL_ALIASES[field].some(alias=>h===alias || h.includes(alias));
}
function parseWorkbookRows(workbook){
  const sheet = workbook.Sheets[workbook.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, { defval:null });
  if(!rows.length) return { rows:[], error:"The first sheet has no data rows." };
  const headers = Object.keys(rows[0]);
  const colMap = {};
  Object.keys(IMPORT_COL_ALIASES).forEach(field=>{
    colMap[field] = headers.find(h=>matchColumn(h, field));
  });
  if(!colMap.symbol || !colMap.quantity || !colMap.boughtPrice){
    return { rows:[], error:`Couldn't find required columns. Found headers: ${headers.join(", ")}. Need at least a stock name/ticker, quantity, and bought price column.` };
  }
  const parsed = rows.map(r=>({
    symbol: r[colMap.symbol] != null ? String(r[colMap.symbol]).trim() : "",
    market: colMap.market ? (r[colMap.market] || "US") : "US",
    quantity: colMap.quantity ? Number(r[colMap.quantity]) || 0 : 0,
    boughtPrice: colMap.boughtPrice ? Number(r[colMap.boughtPrice]) || null : null,
    currency: colMap.currency ? (String(r[colMap.currency]||"USD").trim().toUpperCase() || "USD") : "USD",
    purchaseDate: colMap.purchaseDate ? r[colMap.purchaseDate] : null,
  })).filter(r=>r.symbol);
  return { rows:parsed, error:null };
}

function drawCharts(){

    const fibDatasets = Object.entries(fib.levels).map(([ratio,val],idx)=>({
      label:`Fib ${(parseFloat(ratio)*100).toFixed(1)}%`, data:pf.map(()=>val), borderColor:"rgba(148,163,184,0.55)",

        { label:"SMA50", data:s50, borderColor:"#B45309", pointRadius:0, borderWidth:1.5 },
        ...fibDatasets,
      ]},
      options:{ plugins:{legend:{display:true,labels:{boxWidth:8,font:{size:9}}}}, scales:{ x:{grid:{display:false},ticks:{maxTicksLimit:6}}, y:{grid:{color:"#EEF2F7"}} } }
    });

    const rsiSeries = rsiFn(pf,14);
    const ctxR=document.getElementById("chartRsi");
    chartRegistry.rsi = new Chart(ctxR,{
      type:'line',
      data:{ labels, datasets:[
        { data:rsiSeries, borderColor:"#7C3AED", pointRadius:0, borderWidth:1.5, tension:.2 },
        { data:pf.map(()=>70), borderColor:"rgba(220,38,38,0.4)", borderDash:[3,3], pointRadius:0, borderWidth:1 },
        { data:pf.map(()=>30), borderColor:"rgba(21,128,61,0.4)", borderDash:[3,3], pointRadius:0, borderWidth:1 },
      ]},
      options:{ plugins:{legend:{display:false}}, scales:{ x:{grid:{display:false},ticks:{maxTicksLimit:6}}, y:{min:0,max:100,grid:{color:"#EEF2F7"}} } }
    });
  }
  if(state.view==="portfolio"){
    const positions=getPositions();
    const sectorMap={};
    positions.forEach(p=>{ const sec=p.sector||"Unknown"; sectorMap[sec]=(sectorMap[sec]||0)+p.value; });
    const ctx=document.getElementById("chartSector");
    if(ctx){
      chartRegistry.sector = new Chart(ctx,{
        type:'doughnut',
        data:{ labels:Object.keys(sectorMap), datasets:[{ data:Object.values(sectorMap).map(v=>Math.round(v)), backgroundColor:CHART_PALETTE, borderColor:"#fff", borderWidth:2 }] },
        options:{ plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:10.5}}}} }
      });
    }
    renderCorrMatrix(positions.map(p=>p.ticker));

    const totalValue=positions.reduce((a,p)=>a+p.value,0);
    const weights=getWeights(positions,totalValue);
    const risk=computeRisk(weights,totalValue);
    const ctxMc=document.getElementById("chartMonteCarlo");
    if(ctxMc && risk && totalValue>0){
      const horizonDays=252, numPaths=300, checkpoints=[21,63,126,189,252];
      const sig = `${Math.round(totalValue)}|${risk.annReturn.toFixed(4)}|${risk.annVol.toFixed(4)}`;
      if(!MC_CACHE || MC_CACHE.sig!==sig){
        MC_CACHE = { sig, fan: monteCarloFanSeries(totalValue, risk.annReturn, risk.annVol, horizonDays, numPaths, checkpoints) };
      }
      const fan = MC_CACHE.fan;
      chartRegistry.mc = new Chart(ctxMc,{
        type:'line',
        data:{ labels:fan.map(f=>`${f.day}d`), datasets:[
          { label:"5th pctl", data:fan.map(f=>f.p05), borderColor:"rgba(220,38,38,0.5)", borderDash:[3,3], pointRadius:0, borderWidth:1 },
          { label:"25th pctl", data:fan.map(f=>f.p25), borderColor:"rgba(74,127,181,0.6)", pointRadius:0, borderWidth:1 },
          { label:"Median", data:fan.map(f=>f.p50), borderColor:"#0F4C81", pointRadius:0, borderWidth:2 },
          { label:"75th pctl", data:fan.map(f=>f.p75), borderColor:"rgba(74,127,181,0.6)", pointRadius:0, borderWidth:1 },
          { label:"95th pctl", data:fan.map(f=>f.p95), borderColor:"rgba(21,128,61,0.5)", borderDash:[3,3], pointRadius:0, borderWidth:1 },
        ]},
        options:{ plugins:{legend:{display:true,labels:{boxWidth:8,font:{size:9}}}}, scales:{ x:{grid:{display:false}}, y:{grid:{color:"#EEF2F7"},ticks:{callback:v=>"$"+Math.round(v/1000)+"k"}} } }
      });
      const terminal = fan[fan.length-1];
      const readout = document.getElementById("mcReadout");
      if(readout){
        readout.innerHTML = `
          <div><div class="stat-label">Median (1yr)</div><div class="stat-value small">${fmtMoney(terminal.p50)}</div></div>
          <div><div class="stat-label">5th Pctl (1yr)</div><div class="stat-value small" style="color:var(--red);">${fmtMoney(terminal.p05)}</div></div>
          <div><div class="stat-label">95th Pctl (1yr)</div><div class="stat-value small" style="color:var(--green);">${fmtMoney(terminal.p95)}</div></div>
        `;
      }
    }
  }
  if(state.view==="comparison"){
    const selected=state.comparisonSet;
    const ctxV=document.getElementById("chartValuation");
    chartRegistry.val = new Chart(ctxV,{
      type:'bar',
      data:{ labels:selected, datasets:[{ data:selected.map(t=>UNIVERSE[t].pe||0), backgroundColor:selected.map((_,i)=>CHART_PALETTE[i%CHART_PALETTE.length]) }] },
      options:{ plugins:{legend:{display:false}}, scales:{ x:{grid:{display:false}}, y:{grid:{color:"#EEF2F7"}} } }
    });
    const ctxG=document.getElementById("chartGrowth");
    chartRegistry.growth = new Chart(ctxG,{
      type:'bar',
      data:{ labels:selected, datasets:[{ data:selected.map(t=>UNIVERSE[t].revGrowth?+(UNIVERSE[t].revGrowth*100).toFixed(1):0), backgroundColor:selected.map((_,i)=>CHART_PALETTE[i%CHART_PALETTE.length]) }] },
      options:{ plugins:{legend:{display:false}}, scales:{ x:{grid:{display:false}}, y:{grid:{color:"#EEF2F7"},ticks:{callback:v=>v+"%"}} } }
    });
  }
}
function renderCorrMatrix(tickers){
  const el=document.getElementById("corrMatrix");
  if(!el) return;
  if(tickers.length===0){ el.innerHTML='<div class="footnote">No holdings yet.</div>'; return; }
  let html=`<div style="overflow-x:auto;"><table style="font-size:10.5px;"><thead><tr><th></th>${tickers.map(t=>`<th>${t}</th>`).join("")}</tr></thead><tbody>`;
  tickers.forEach(t1=>{
    html+=`<tr><th>${t1}</th>`;
    tickers.forEach(t2=>{
      const c = t1===t2?1:correlation(RETURNS[t1],RETURNS[t2]);
      const intensity=Math.abs(c);
      const color = c>=0 ? `rgba(15,76,129,${0.08+intensity*0.42})` : `rgba(220,38,38,${0.08+intensity*0.42})`;
      html+=`<td class="heat-cell" style="background:${color};">${c.toFixed(2)}</td>`;
    });
    html+=`</tr>`;
  });
  html+=`</tbody></table></div>`;
  el.innerHTML=html;
}

/* =========================================================================
   REFRESH FLOW
   ========================================================================= */
async function startRefresh(){
  const tickers = refreshScopeTickers();
  try{
    const resp = await fetch("/api/refresh", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ tickers, includeExtras: state.includeExtras, mode: state.refreshMode }) });
    const json = await resp.json();
    if(!resp.ok){ alert(json.error || "Refresh failed to start."); return; }
    state.job = { id:json.jobId, kind:"refresh", total:json.total, completed:0, log:["Refresh started…"], status:"running" };
    renderRefreshModal();
    pollJob();
  } catch(e){
    alert("Could not reach the local server. Is it running? (node server.js)");
  }
}
async function startImport(){
  if(!state.importRows || !state.importRows.length) return;
  try{
    const resp = await fetch("/api/import-portfolio", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({ positions: state.importRows }) });
    const json = await resp.json();
    if(!resp.ok){ alert(json.error || "Import failed to start."); return; }
    state.job = { id:json.jobId, kind:"import", total:json.total, completed:0, log:["Import started…"], status:"running" };
    renderImportModal();
    pollJob();
  } catch(e){
    alert("Could not reach the local server. Is it running? (node server.js)");
  }
}
function pollJob(){
  if(state.jobPollHandle) clearInterval(state.jobPollHandle);
  state.jobPollHandle = setInterval(async ()=>{
    try{
      const resp = await fetch("/api/refresh/status");
      const job = await resp.json();
      state.job = job;
      renderRefreshModal(); renderImportModal();
      if(job.status!=="running"){
        clearInterval(state.jobPollHandle);
        await loadLiveData();
        if(job.kind==="import"){ state.importRows=null; }
        render();
      }
    } catch(e){ /* transient — keep polling */ }
  }, 1500);
}

/* =========================================================================
   EVENT HANDLERS
   ========================================================================= */
function attachHandlers(){
  document.querySelectorAll("[data-open]").forEach(el=>el.addEventListener("click",()=>{ state.selectedTicker=el.dataset.open; state.view="detail"; render(); }));
  document.querySelectorAll("[data-view-link]").forEach(el=>el.addEventListener("click",()=>{ state.view=el.dataset.viewLink; render(); }));

  const dashSearch=document.getElementById("dashSearch");
  if(dashSearch) dashSearch.addEventListener("input",()=>{ state.searchQuery=dashSearch.value; render(); setTimeout(()=>{ const el=document.getElementById("dashSearch"); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } },0); });

  const detailSelect=document.getElementById("detailSelect");
  if(detailSelect) detailSelect.addEventListener("change",()=>{ state.selectedTicker=detailSelect.value; render(); });

  document.querySelectorAll("[data-add]").forEach(el=>el.addEventListener("click",()=>{
    const t=el.dataset.add; state.portfolio[t]=(state.portfolio[t]||0)+50; state.view="portfolio"; render();
  }));
  document.querySelectorAll("[data-step]").forEach(el=>el.addEventListener("click",()=>{
    const t=el.dataset.step, delta=parseInt(el.dataset.delta,10);
    const next=Math.max(0,(state.portfolio[t]||0)+delta);
    if(next===0) delete state.portfolio[t]; else state.portfolio[t]=next;
    render();
  }));
  document.querySelectorAll("[data-remove]").forEach(el=>el.addEventListener("click",()=>{ delete state.portfolio[el.dataset.remove]; render(); }));

  document.querySelectorAll("[data-target]").forEach(el=>el.addEventListener("change",()=>{
    const t=el.dataset.target, v=parseFloat(el.value);
    if(el.value===""||isNaN(v)) delete state.targetWeights[t]; else state.targetWeights[t]=Math.max(0,Math.min(100,v))/100;
    render();
  }));
  const scenarioSelect=document.getElementById("scenarioSelect");
  if(scenarioSelect) scenarioSelect.addEventListener("change",()=>{ state.stressScenario=scenarioSelect.value; render(); });

  const openAddModal=document.getElementById("openAddModal");
  if(openAddModal) openAddModal.addEventListener("click",()=>{ state.modalOpen=true; render(); });

  document.querySelectorAll("[data-toggle]").forEach(el=>el.addEventListener("click",()=>{
    const t=el.dataset.toggle;
    if(state.comparisonSet.includes(t)){ if(state.comparisonSet.length>1) state.comparisonSet=state.comparisonSet.filter(x=>x!==t); }
    else { if(state.comparisonSet.length<6) state.comparisonSet.push(t); }
    render();
  }));

  document.querySelectorAll("[data-sort]").forEach(el=>el.addEventListener("click",()=>{
    const col=el.dataset.sort;
    if(state.screenerSort.col===col) state.screenerSort.dir = state.screenerSort.dir==="asc"?"desc":"asc";
    else state.screenerSort = { col, dir:"desc" };
    render();
  }));

  const backdrop=document.getElementById("modalBackdrop");
  if(backdrop) backdrop.addEventListener("click",e=>{ if(e.target===backdrop){ state.modalOpen=false; state.modalQuery=""; render(); } });
  const modalClose=document.getElementById("modalCloseBtn");
  if(modalClose) modalClose.addEventListener("click",()=>{ state.modalOpen=false; state.modalQuery=""; render(); });
  const modalSearch=document.getElementById("modalSearchInput");
  if(modalSearch){ modalSearch.addEventListener("input",()=>{ state.modalQuery=modalSearch.value; render(); setTimeout(()=>{ const el=document.getElementById("modalSearchInput"); if(el){ el.focus(); el.setSelectionRange(el.value.length,el.value.length); } },0); }); }
  document.querySelectorAll("[data-modal-add]").forEach(el=>el.addEventListener("click",()=>{
    const t=el.dataset.modalAdd; state.portfolio[t]=(state.portfolio[t]||0)+50; state.modalOpen=false; state.modalQuery=""; render();
  }));

  const openRefreshModal=document.getElementById("openRefreshModal");
  if(openRefreshModal) openRefreshModal.addEventListener("click",async ()=>{ state.refreshModalOpen=true; await pingServer(); render(); });
  const refreshBackdrop=document.getElementById("refreshBackdrop");
  if(refreshBackdrop) refreshBackdrop.addEventListener("click",e=>{ if(e.target===refreshBackdrop && !(state.job&&state.job.status==="running")){ state.refreshModalOpen=false; render(); } });
  const refreshClose=document.getElementById("refreshCloseBtn");
  if(refreshClose) refreshClose.addEventListener("click",()=>{ if(!(state.job&&state.job.status==="running")){ state.refreshModalOpen=false; render(); } });
  document.querySelectorAll("[data-scope]").forEach(el=>el.addEventListener("click",()=>{ state.refreshScope=el.dataset.scope; render(); }));
  document.querySelectorAll("[data-mode]").forEach(el=>el.addEventListener("click",()=>{ state.refreshMode=el.dataset.mode; if(state.refreshMode==="price") state.includeExtras=false; render(); }));
  const includeExtrasCheckbox=document.getElementById("includeExtrasCheckbox");
  if(includeExtrasCheckbox) includeExtrasCheckbox.addEventListener("change",()=>{ state.includeExtras=includeExtrasCheckbox.checked; render(); });
  const startBtn=document.getElementById("startRefreshBtn");
  if(startBtn) startBtn.addEventListener("click",startRefresh);

  const openImportModal=document.getElementById("openImportModal");
  if(openImportModal) openImportModal.addEventListener("click",async ()=>{ state.importModalOpen=true; state.importRows=null; state.importError=null; await pingServer(); render(); });
  const importBackdrop=document.getElementById("importBackdrop");
  if(importBackdrop) importBackdrop.addEventListener("click",e=>{ if(e.target===importBackdrop && !(state.job&&state.job.kind==="import"&&state.job.status==="running")){ state.importModalOpen=false; render(); } });
  const importClose=document.getElementById("importCloseBtn");
  if(importClose) importClose.addEventListener("click",()=>{ if(!(state.job&&state.job.kind==="import"&&state.job.status==="running")){ state.importModalOpen=false; render(); } });
  const importFileInput=document.getElementById("importFileInput");
  if(importFileInput) importFileInput.addEventListener("change",async (e)=>{
    const file=e.target.files[0];
    if(!file) return;
    try{
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type:"array", cellDates:true });
      const { rows, error } = parseWorkbookRows(wb);
      state.importRows = rows;
      state.importError = error;
      render();
    } catch(err){
      state.importError = "Couldn't read that file — make sure it's a valid .xlsx/.xls/.csv.";
      state.importRows = null;
      render();
    }
  });
  const startImportBtn=document.getElementById("startImportBtn");
  if(startImportBtn) startImportBtn.addEventListener("click",startImport);
}

/* =========================================================================
   INIT
   ========================================================================= */
render();
pingServer().then(()=>{ renderNav(); });
loadLiveData().then(render);
</script>
