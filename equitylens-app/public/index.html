function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function series(seed, length, scale){
  const rand = mulberry32(seed);
  const out = [];
  for(let i=0;i<length;i++) out.push((rand()-0.5)*2*scale);
  return out;
}

function ensureTickerExists(ticker, fallback){
  if(!TICKERS.includes(ticker)){
    TICKERS = [...TICKERS, ticker];

  if(!UNIVERSE[ticker]){
    UNIVERSE[ticker] = {
      name: (fallback && fallback.name) || ticker,

      week52Low:null, week52High:null, avgVolume:null,

  if(!PRICES_FULL[ticker]){

    PRICES_FULL[ticker] = placeholderPrices(price, RISK_WINDOW+1);

/* =========================================================================
   RISK / PORTFOLIO KPI FORMULAS — ported verbatim from the
   equitylens-risk-kpis skill.
   ========================================================================= */
function mean(arr){ return arr.reduce((a,b)=>a+b,0)/arr.length; }
function variance(arr, ddof=0){ const m=mean(arr); const sumSq=arr.reduce((a,b)=>a+(b-m)**2,0); return sumSq/(arr.length-ddof); }
function stdev(arr, ddof=0){ return Math.sqrt(variance(arr,ddof)); }
function covariance(a,b,ddof=0){ const ma=mean(a),mb=mean(b); let sum=0; for(let i=0;i<a.length;i++) sum+=(a[i]-ma)*(b[i]-mb); return sum/(a.length-ddof); }
function correlation(a,b){ return covariance(a,b)/(stdev(a)*stdev(b)); }
function normalPdf(z){ return (1/Math.sqrt(2*Math.PI))*Math.exp(-(z*z)/2); }
function portfolioReturnsFn(weights, returnsByTicker){
  const tickers = Object.keys(weights);
  const n = returnsByTicker[tickers[0]].length;
  const out = new Array(n).fill(0);
  for(let t=0;t<n;t++){ let r=0; for(const tk of tickers) r += weights[tk]*returnsByTicker[tk][t]; out[t]=r; }
  return out;
}
function sharpeRatio(dailyReturns, rfAnnual){
  const annReturn = mean(dailyReturns)*TRADING_DAYS_PER_YEAR;
  const annVol = stdev(dailyReturns)*Math.sqrt(TRADING_DAYS_PER_YEAR);
  return annVol>0 ? (annReturn-rfAnnual)/annVol : 0;
}
function downsideDeviation(dailyReturns, targetDaily=0){
  const sq = dailyReturns.map(r=>Math.min(0, r-targetDaily)**2);
  return Math.sqrt(mean(sq));
}
function sortinoRatio(dailyReturns, rfAnnual, targetDaily=0){
  const annReturn = mean(dailyReturns)*TRADING_DAYS_PER_YEAR;
  const annDownsideDev = downsideDeviation(dailyReturns, targetDaily)*Math.sqrt(TRADING_DAYS_PER_YEAR);
  return annDownsideDev>0 ? (annReturn-rfAnnual)/annDownsideDev : 0;
}
function treynorRatio(dailyReturns, rfAnnual, portfBeta){
  const annReturn = mean(dailyReturns)*TRADING_DAYS_PER_YEAR;
  return portfBeta!==0 ? (annReturn-rfAnnual)/portfBeta : 0;
}
function jensensAlpha(dailyReturns, benchmarkDailyReturns, rfAnnual, portfBeta){
  const annReturn = mean(dailyReturns)*TRADING_DAYS_PER_YEAR;
  const annBenchReturn = mean(benchmarkDailyReturns)*TRADING_DAYS_PER_YEAR;
  return annReturn - (rfAnnual + portfBeta*(annBenchReturn-rfAnnual));
}
function informationRatio(dailyReturns, benchmarkDailyReturns){
  const active = dailyReturns.map((r,i)=>r-benchmarkDailyReturns[i]);
  const annActiveReturn = mean(active)*TRADING_DAYS_PER_YEAR;
  const trackingError = stdev(active)*Math.sqrt(TRADING_DAYS_PER_YEAR);
  return trackingError>0 ? annActiveReturn/trackingError : 0;
}
function parametricVaR(portfolioValue, dailyReturns, confidence=0.95, horizonDays=1){
  const z = confidence===0.99 ? 2.326 : 1.645;
  const dailyVol = stdev(dailyReturns);
  const pct = z*dailyVol*Math.sqrt(horizonDays);
  return { pct, value: portfolioValue*pct };
}
function parametricCVaR(portfolioValue, dailyReturns, confidence=0.95, horizonDays=1){
  const z = confidence===0.99 ? 2.326 : 1.645;
  const alpha = 1-confidence;
  const dailyVol = stdev(dailyReturns);
  const pct = ((normalPdf(z)/alpha)*dailyVol)*Math.sqrt(horizonDays);
  return { pct, value: portfolioValue*pct };
}
function maxDrawdown(priceSeries){
  let runningMax=priceSeries[0], worst=0;
  for(const p of priceSeries){ runningMax=Math.max(runningMax,p); const dd=(p-runningMax)/runningMax; worst=Math.min(worst,dd); }
  return worst;
}
function betaOf(assetReturns, benchReturns){ return covariance(assetReturns,benchReturns)/variance(benchReturns); }
function portfolioBetaFn(weights, betasByTicker){ return Object.keys(weights).reduce((sum,tk)=>sum+weights[tk]*betasByTicker[tk],0); }
function rSquared(assetReturns, benchReturns){ return correlation(assetReturns,benchReturns)**2; }
function hhi(weights){ return Object.values(weights).reduce((s,w)=>s+w*w,0); }
function effectiveN(weights){ const h=hhi(weights); return h>0?1/h:0; }

/* =========================================================================
   TECHNICAL ANALYSIS & VALUATION-SCREEN FORMULAS —
   ported verbatim from the equitylens-technical-indicators skill.
   ========================================================================= */
function sma(prices, length){
  const out = new Array(prices.length).fill(null);
  let sum = 0;
  for (let i = 0; i < prices.length; i++) {
    sum += prices[i];
    if (i >= length) sum -= prices[i - length];
    if (i >= length - 1) out[i] = sum / length;
  }
  return out;
}
function ema(prices, length){
  const out = new Array(prices.length).fill(null);
  const k = 2/(length+1);
  let prev = null;
  for(let i=0;i<prices.length;i++){
    if(i===length-1){ let sum=0; for(let j=0;j<=i;j++) sum+=prices[j]; prev=sum/length; out[i]=prev; }
    else if(i>=length){ prev = prices[i]*k + prev*(1-k); out[i]=prev; }
  }
  return out;
}
function rsiFn(prices, length=14){
  const out = new Array(prices.length).fill(null);
  if(prices.length<=length) return out;
  let gains=0, losses=0;
  for(let i=1;i<=length;i++){ const chg=prices[i]-prices[i-1]; if(chg>=0) gains+=chg; else losses-=chg; }
  let avgGain=gains/length, avgLoss=losses/length;
  out[length] = avgLoss===0?100:100-100/(1+avgGain/avgLoss);
  for(let i=length+1;i<prices.length;i++){
    const chg=prices[i]-prices[i-1];
    const gain=chg>0?chg:0, loss=chg<0?-chg:0;
    avgGain=(avgGain*(length-1)+gain)/length;
    avgLoss=(avgLoss*(length-1)+loss)/length;
    out[i]=avgLoss===0?100:100-100/(1+avgGain/avgLoss);
  }
  return out;
}
function rateOfChange(prices, length){
  const n=prices.length;
  if(n<=length) return null;
  const past = prices[n-1-length];
  return past===0?null:(prices[n-1]-past)/past;
}
function analystConsensus(s){
  const sb=s.analystStrongBuy||0, b=s.analystBuy||0, h=s.analystHold||0, se=s.analystSell||0, ss=s.analystStrongSell||0;
  const total = sb+b+h+se+ss;
  const target = s.analystTargetPrice!=null ? s.analystTargetPrice : null;
  if(total===0 && target==null) return null;
  const score = total>0 ? (sb*2+b*1+h*0+se*-1+ss*-2)/total : null; // -2 (Strong Sell) .. +2 (Strong Buy)
  let label = "No rating data";
  if(score!=null){
    if(score>=1.2) label="Strong Buy";
    else if(score>=0.4) label="Buy";
    else if(score>-0.4) label="Hold";
    else if(score>-1.2) label="Sell";
    else label="Strong Sell";
  }
  const upside = (target!=null && s.price) ? (target-s.price)/s.price : null;
  return { sb,b,h,se,ss,total,label,target,upside };
}
function ratingClass(label){
  if(label==="Strong Buy"||label==="Buy") return "bullish";
  if(label==="Sell"||label==="Strong Sell") return "bearish";
  if(label==="Hold") return "fair";
  return "neutral";
}
function trendSignal(maShort, maLong, price){
  if(maShort==null||maLong==null) return "N/A";
  if(maShort>maLong && price>maShort) return "Bullish";
  if(maShort<maLong && price<maShort) return "Bearish";
  return "Neutral";
}
function fibonacciRetracement(prices, lookback){
  const window = prices.slice(-lookback);
  const high = Math.max(...window), low = Math.min(...window);
  const diff = high-low;
  const uptrend = window[window.length-1] >= window[0];
  const ratios = [0,0.236,0.382,0.5,0.618,0.786,1];
  const levels = {};
  ratios.forEach(r=>{ levels[r] = uptrend ? high-diff*r : low+diff*r; });
  return { high, low, uptrend, levels };
}
function impliedPeSeries(priceSeries, eps){
  if(!eps || eps<=0) return priceSeries.map(()=>null);
  return priceSeries.map(p=>p/eps);
}
function percentileRank(series, value){
  const valid = series.filter(x=>x!=null && !isNaN(x));
  if(valid.length===0) return null;
  const below = valid.filter(x=>x<=value).length;
  return below/valid.length;
}
function valuationTag(percentile){
  if(percentile==null) return "N/A";
  if(percentile<=0.25) return "Cheap vs. history";
  if(percentile>=0.75) return "Expensive vs. history";
  return "Fair vs. history";
}
function momentumScore(prices){
  const roc20 = rateOfChange(prices,20);
  const roc60 = rateOfChange(prices, Math.min(60, prices.length-1));
  const rsiSeries = rsiFn(prices,14);
  const latestRsi = rsiSeries[rsiSeries.length-1];
  if(roc20==null && roc60==null && latestRsi==null) return null;
  const rocComponent = ((roc20||0)+(roc60||0))/2;
  const rsiComponent = latestRsi!=null ? (latestRsi-50)/50 : 0;
  return rocComponent*0.7 + rsiComponent*0.3;
}

// Factor-based stress testing: overrides the normal covariance assumptions
// behind parametric VaR with one deterministic market move, propagated through
// each position's beta. Idiosyncratic (stock-specific) risk isn't modeled in
// a scenario shock — that's the standard simplification this approach makes.
function scenarioImpact(positions, weights, totalValue, shockPct){
  let deltaValue = 0;
  const byPosition = positions.map(p=>{
    const beta = STOCK_BETA[p.ticker] ?? 1;
    const posReturn = beta * shockPct;
    const posDelta = p.value * posReturn;
    deltaValue += posDelta;
    return { ticker:p.ticker, beta, posReturn, posDelta };
  }).sort((a,b)=>a.posDelta-b.posDelta);
  return { totalValue, deltaValue, newValue: totalValue+deltaValue, pctImpact: totalValue>0?deltaValue/totalValue:0, byPosition };
}

// --- Rebalancing: drift from a user-set target weight, suggested trade to close it ---
function rebalanceSuggestion(currentWeight, targetWeight, totalValue){
  const drift = (currentWeight??0) - (targetWeight??currentWeight??0);
  const targetValue = (targetWeight??currentWeight??0) * totalValue;
  const currentValue = (currentWeight??0) * totalValue;
  return { drift, tradeValue: targetValue - currentValue }; // positive = buy, negative = sell
}

// --- Concentration & correlation risk flags ---
function concentrationFlags(positions, weights, opts={}){
  const posThreshold = opts.posThreshold ?? 0.20;
  const sectorThreshold = opts.sectorThreshold ?? 0.35;
  const corrThreshold = opts.corrThreshold ?? 0.70;
  const flags = [];
  positions.forEach(p=>{
    const w = weights[p.ticker]||0;
    if(w >= posThreshold) flags.push({ level:"warn", text:`${p.ticker} is ${fmtPlain(w)} of the portfolio — above the ${fmtPlain(posThreshold,0)} single-position threshold.` });
  });
  const sectorMap = {};
  positions.forEach(p=>{ const sec=p.sector||"Unknown"; sectorMap[sec]=(sectorMap[sec]||0)+(weights[p.ticker]||0); });
  Object.entries(sectorMap).forEach(([sec,w])=>{
    if(w >= sectorThreshold) flags.push({ level:"warn", text:`${escapeHtml(sec)} sector is ${fmtPlain(w)} of the portfolio — above the ${fmtPlain(sectorThreshold,0)} sector threshold.` });
  });
  const tickers = positions.map(p=>p.ticker);
  for(let i=0;i<tickers.length;i++){
    for(let j=i+1;j<tickers.length;j++){
      const t1=tickers[i], t2=tickers[j];
      if(!RETURNS[t1]||!RETURNS[t2]) continue;
      const c = correlation(RETURNS[t1],RETURNS[t2]);
      if(c >= corrThreshold){
        const combined = (weights[t1]||0)+(weights[t2]||0);
        flags.push({ level:"info", text:`${t1} and ${t2} correlate at ${fmtNum(c,2)} (combined ${fmtPlain(combined)} of NAV) — moves together, not true diversification.` });
      }
    }
  }
  if(flags.length===0) flags.push({ level:"ok", text:"No concentration or correlation flags at current thresholds." });
  return flags;
}

// --- Liquidity: days to liquidate a position at its average daily volume ---
function daysToLiquidate(shares, avgVolumeM){
  if(!avgVolumeM || avgVolumeM<=0) return null;
  return shares / (avgVolumeM*1e6);
}
// Assumes only 20% of a day's average volume can be sold without moving the
// price — a standard rule-of-thumb liquidity constraint, not a hard limit.
function liquidityFlags(positions, opts={}){
  const dayThreshold = opts.dayThreshold ?? 1;
  const participationRate = opts.participationRate ?? 0.20;
  const flags = [];
  positions.forEach(p=>{
    const rawDays = daysToLiquidate(p.shares, p.avgVolume);
    if(rawDays==null) return;
    const days = rawDays/participationRate;
    if(days >= dayThreshold){
      flags.push({ level:"info", text:`${p.ticker}: ~${fmtNum(days,1)} trading days to exit at 20% of average daily volume (${fmtNum(p.avgVolume,1)}M shares/day) without materially moving the price.` });
    }
  });
  return flags;
}

// --- Style box: size (market cap) x style (P/E percentile as a value/growth proxy) ---
function sizeBucket(marketCap){
  if(marketCap==null) return "Mid"; // ETFs / unknown default to the middle bucket
  if(marketCap >= 200e9) return "Large";
  if(marketCap >= 10e9) return "Mid";
  return "Small";
}
function styleBucketOf(pePctl){
  if(pePctl==null) return "Blend";
  if(pePctl <= 0.33) return "Value";
  if(pePctl >= 0.67) return "Growth";
  return "Blend";
}
function styleBoxWeights(positions, weights){
  const sizes=["Large","Mid","Small"], styles=["Value","Blend","Growth"];
  const grid = {};
  sizes.forEach(sz=>styles.forEach(st=>grid[`${sz}/${st}`]=0));
  positions.forEach(p=>{
    const sz = sizeBucket(p.marketCap);
    const st = styleBucketOf(STOCK_PE_PCTL[p.ticker]);
    grid[`${sz}/${st}`] += weights[p.ticker]||0;
  });
  return grid;
}

// --- Composite score: blends already-computed percentiles into one 0-100 signal,
//     same idea as Simply Wall St's Snowflake / Seeking Alpha's Quant Rating. ---
function compositeScore(t){
  const s = UNIVERSE[t];
  const parts = [];
  if(STOCK_PE_PCTL[t]!=null) parts.push({ w:0.30, v:(1-STOCK_PE_PCTL[t])*100 });          // cheap vs. history -> high score
  if(STOCK_MOM[t]!=null) parts.push({ w:0.30, v:Math.max(0,Math.min(100,(STOCK_MOM[t]+0.5)*100)) }); // momentum
  if(s.roe!=null) parts.push({ w:0.20, v:Math.max(0,Math.min(100,(s.roe/0.30)*100)) });    // quality (ROE)
  if(s.revGrowth!=null) parts.push({ w:0.20, v:Math.max(0,Math.min(100,(s.revGrowth/0.30)*100)) }); // growth
  if(parts.length===0) return null;
  const totalW = parts.reduce((a,p)=>a+p.w,0);
  return Math.round(parts.reduce((a,p)=>a+p.w*p.v,0)/totalW);
}
function compositeScoreBreakdown(t){
  const s = UNIVERSE[t];
  return {
    valuation: STOCK_PE_PCTL[t]!=null ? Math.round((1-STOCK_PE_PCTL[t])*100) : null,
    momentum: STOCK_MOM[t]!=null ? Math.round(Math.max(0,Math.min(100,(STOCK_MOM[t]+0.5)*100))) : null,
    quality: s.roe!=null ? Math.round(Math.max(0,Math.min(100,(s.roe/0.30)*100))) : null,
    growth: s.revGrowth!=null ? Math.round(Math.max(0,Math.min(100,(s.revGrowth/0.30)*100))) : null,
  };
}
function scoreClass(score){
  if(score==null) return "neutral";
  if(score>=65) return "bullish";
  if(score<=35) return "bearish";
  return "fair";
}

// --- Monte Carlo: GBM forward simulation of portfolio value, sampled at checkpoints ---
function monteCarloFanSeries(startValue, annReturn, annVol, horizonDays, numPaths, checkpoints, seed=42){
  const rand = mulberry32(seed);
  const dt = 1/TRADING_DAYS_PER_YEAR;
  const drift = (annReturn - 0.5*annVol*annVol) * dt;
  const vol = annVol * Math.sqrt(dt);
  const series = checkpoints.map(()=>[]);
  for(let p=0; p<numPaths; p++){
    let v = startValue; let ci = 0;
    for(let d=1; d<=horizonDays; d++){
      const u1 = Math.max(rand(), 1e-9), u2 = rand();
      const z = Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2); // Box-Muller standard normal
      v = v * Math.exp(drift + vol*z);
      if(ci<checkpoints.length && d===checkpoints[ci]){ series[ci].push(v); ci++; }
    }
  }
  const pct = (arr,q) => { const s=[...arr].sort((a,b)=>a-b); return s.length?s[Math.min(s.length-1,Math.max(0,Math.round(q*(s.length-1))))]:startValue; };
  return checkpoints.map((day,i)=>({ day, p05:pct(series[i],0.05), p25:pct(series[i],0.25), p50:pct(series[i],0.50), p75:pct(series[i],0.75), p95:pct(series[i],0.95) }));
}

// --- Empirical (historical-simulation) VaR/CVaR — doesn't assume normal returns,
//     a natural pairing with the parametric version already in the risk-kpis skill. ---
function empiricalVaR(portfolioValue, dailyReturns, confidence=0.95){
  const sorted = [...dailyReturns].sort((a,b)=>a-b);
  const idx = Math.max(0, Math.floor((1-confidence)*sorted.length)-1);
  const pct = Math.abs(Math.min(0, sorted[idx] ?? 0));
  return { pct, value: portfolioValue*pct };
}
function empiricalCVaR(portfolioValue, dailyReturns, confidence=0.95){
  const sorted = [...dailyReturns].sort((a,b)=>a-b);
  const cutoff = Math.max(1, Math.floor((1-confidence)*sorted.length));
  const tail = sorted.slice(0, cutoff);
  const pct = Math.abs(Math.min(0, tail.length?mean(tail):0));
  return { pct, value: portfolioValue*pct };
}

// --- Unrealized P&L (now that avgCost is tracked per position via Excel import) ---
function unrealizedPnL(shares, avgCost, price){
  if(avgCost==null || price==null) return { dollar:null, pct:null };
  return { dollar: shares*(price-avgCost), pct: avgCost>0 ? (price-avgCost)/avgCost : null };
}

// --- Dividend income: prefers real trailing-12mo history (DIVIDENDS endpoint,
//     opt-in on refresh), falls back to current-yield x price when unavailable ---
function trailingDividendPerShare(ticker){
  const d = DIVIDENDS[ticker];
  if(d && d.history && d.history.length){
    const oneYearAgo = new Date(); oneYearAgo.setFullYear(oneYearAgo.getFullYear()-1);
    const recent = d.history.filter(h=>{ const dt=new Date(h.exDate); return !isNaN(dt) && dt >= oneYearAgo; });
    const sum = recent.reduce((a,h)=>a+(h.amount||0),0);
    if(sum>0) return { perShare: sum, source:"history" };
  }
  const s = UNIVERSE[ticker];
  if(s && s.divYield && s.price) return { perShare: s.divYield*s.price, source:"yield" };
  return { perShare:0, source:"none" };
}
function portfolioDividendIncome(positions){
  let annualIncome=0;
  const rows = positions.map(p=>{
    const info = trailingDividendPerShare(p.ticker);
    const income = p.shares*info.perShare;
    annualIncome += income;
    return { ticker:p.ticker, perShare:info.perShare, source:info.source, income };
  }).filter(r=>r.income>0).sort((a,b)=>b.income-a.income);
  return { annualIncome, rows };
}

// Precompute per-stock stats (recomputed whenever live data lands)
const STOCK_BETA={}, STOCK_SHARPE={}, STOCK_ANNVOL={}, STOCK_ANNRET={}, STOCK_MAXDD={}, STOCK_RSQ={};
const STOCK_RSI={}, STOCK_ROC20={}, STOCK_ROC60={}, STOCK_TREND={}, STOCK_MOM={}, STOCK_PE_PCTL={}, STOCK_VAL_TAG={};
function recomputeStockStats(){
  TICKERS.forEach(t=>{
    STOCK_BETA[t]=betaOf(RETURNS[t],BENCH_RETURNS);
    STOCK_SHARPE[t]=sharpeRatio(RETURNS[t],RF);
    STOCK_ANNVOL[t]=stdev(RETURNS[t])*Math.sqrt(TRADING_DAYS_PER_YEAR);
    STOCK_ANNRET[t]=mean(RETURNS[t])*TRADING_DAYS_PER_YEAR;
    STOCK_MAXDD[t]=maxDrawdown(PRICES[t]);
    STOCK_RSQ[t]=rSquared(RETURNS[t],BENCH_RETURNS);

    const pf = PRICES_FULL[t];
    const rsiSeries = rsiFn(pf,14);
    STOCK_RSI[t] = rsiSeries[rsiSeries.length-1];
    STOCK_ROC20[t] = rateOfChange(pf,20);
    STOCK_ROC60[t] = rateOfChange(pf, Math.min(60, pf.length-1));
    const s20 = sma(pf,20), s50 = sma(pf,50);
    STOCK_TREND[t] = trendSignal(s20[s20.length-1], s50[s50.length-1], pf[pf.length-1]);
    STOCK_MOM[t] = momentumScore(pf);
    const eps = UNIVERSE[t].eps || (UNIVERSE[t].pe ? UNIVERSE[t].price/UNIVERSE[t].pe : null);
    const peSeries = impliedPeSeries(pf, eps);
    const pctl = UNIVERSE[t].pe!=null ? percentileRank(peSeries, UNIVERSE[t].pe) : null;
    STOCK_PE_PCTL[t] = pctl;
    STOCK_VAL_TAG[t] = valuationTag(pctl);
  });
}
recomputeStockStats();

/* =========================================================================
   VALUATION ENGINE — equitylens-valuation skill
   DCF, Trading Multiples, Precedent Transactions (illustrative), LBO.
   Pure functions — no ticker strings, no API calls, same design principle as
   the risk-kpis engine above. The one data-model gap that shapes every
   formula here: EquityLens has FCF in dollars but never pulls revenue/EBITDA
   in dollars (would need INCOME_STATEMENT — not fetched, to conserve API
   budget, same tradeoff as debtEquity/fcf already documented in the README).
   So EV/FCF substitutes for EV/EBITDA everywhere below — directionally
   consistent (both are cash-flow multiples), not a like-for-like match.
   Net debt uses a small illustrative mock field (MOCK_NET_DEBT_B, $B) rather
   than being derived from debtEquity x marketCap — that combination back-
   implies a dollar debt figure from a book-equity ratio applied to market-
   value equity, which blows up for high-multiple names. Shares outstanding
   is derived as marketCap / price / 1e9 (billions of shares, to stay unit-
   consistent with FCF/net debt, both in $B). See the equitylens-valuation
   skill for the full write-up and live-data upgrade path.
   ========================================================================= */

// --- WACC / CAPM ---
function calculateWACC({ rf, beta, erp, costOfDebtPretax, taxRate, debtWeight }) {
  const costOfEquity = rf + beta * erp;
  const costOfDebtAfterTax = costOfDebtPretax * (1 - taxRate);
  const equityWeight = 1 - debtWeight;
  const wacc = equityWeight * costOfEquity + debtWeight * costOfDebtAfterTax;
  return { costOfEquity, costOfDebtAfterTax, equityWeight, debtWeight, wacc };
}

// --- DCF ---
function projectFCF(fcfBase, nearTermGrowth, terminalGrowth, years) {
  const path = [];
  let fcf = fcfBase;
  for (let y = 1; y <= years; y++) {
    const g = nearTermGrowth + (terminalGrowth - nearTermGrowth) * (y - 1) / Math.max(1, years - 1);
    fcf = fcf * (1 + g);
    path.push({ year: y, growth: g, fcf });
  }
  return path;
}
// Returns null if wacc <= terminalGrowth (Gordon Growth terminal value is undefined/negative otherwise).
function calculateDCF({ fcfBase, nearTermGrowth, terminalGrowth, years = 5, wacc, netDebt = 0, sharesOut }) {
  if (wacc == null || wacc <= terminalGrowth) return null;
  const path = projectFCF(fcfBase, nearTermGrowth, terminalGrowth, years);
  let pvSum = 0;
  const rows = path.map((p) => {
    const discountFactor = 1 / Math.pow(1 + wacc, p.year);
    const pv = p.fcf * discountFactor;
    pvSum += pv;
    return { ...p, discountFactor, pv };
  });
  const finalFcf = path[path.length - 1].fcf;
  const terminalValue = (finalFcf * (1 + terminalGrowth)) / (wacc - terminalGrowth);
  const pvTerminalValue = terminalValue / Math.pow(1 + wacc, years);
  const enterpriseValue = pvSum + pvTerminalValue;
  const equityValue = enterpriseValue - netDebt;
  const impliedSharePrice = sharesOut > 0 ? equityValue / sharesOut : null;
  return {
    rows, terminalValue, pvTerminalValue, enterpriseValue, equityValue, impliedSharePrice,
    pvOfTerminalPct: enterpriseValue > 0 ? pvTerminalValue / enterpriseValue : null,
  };
}
// 3x3 grid: rows = WACC (-1%, base, +1%), cols = terminal growth (-0.5%, base, +0.5%).
function dcfSensitivity({ fcfBase, nearTermGrowth, terminalGrowth, years, wacc, netDebt, sharesOut }) {
  const waccSteps = [wacc - 0.01, wacc, wacc + 0.01];
  const tgSteps = [terminalGrowth - 0.005, terminalGrowth, terminalGrowth + 0.005];
  return waccSteps.map((w) => tgSteps.map((tg) => {
    const r = calculateDCF({ fcfBase, nearTermGrowth, terminalGrowth: tg, years, wacc: w, netDebt, sharesOut });
    return r ? r.impliedSharePrice : null;
  }));
}

// --- Trading Multiples ---
function peerMedian(values) {
  const v = values.filter((x) => x != null).sort((a, b) => a - b);
  if (!v.length) return null;
  const mid = Math.floor(v.length / 2);
  return v.length % 2 ? v[mid] : (v[mid - 1] + v[mid]) / 2;
}
function calculateTradingMultiples({ peerPE, peerEVFCF, targetEPS, targetFCF, targetNetDebt, sharesOut }) {
  const impliedPrice_PE = peerPE != null && targetEPS != null ? peerPE * targetEPS : null;
  const impliedEV_EVFCF = peerEVFCF != null && targetFCF != null ? peerEVFCF * targetFCF : null;
  const impliedEquity_EVFCF = impliedEV_EVFCF != null ? impliedEV_EVFCF - targetNetDebt : null;
  const impliedPrice_EVFCF = impliedEquity_EVFCF != null && sharesOut > 0 ? impliedEquity_EVFCF / sharesOut : null;
  return { impliedPrice_PE, impliedEV_EVFCF, impliedEquity_EVFCF, impliedPrice_EVFCF };
}

// --- Precedent Transactions — illustrative placeholder, not a real deals database (disclosed in-UI) ---
const MOCK_PRECEDENT_DEALS = [
  { name:"Illustrative Deal A (large-cap strategic)", evFcfMultiple:24.0, premium:0.32 },
  { name:"Illustrative Deal B (mid-cap strategic)",    evFcfMultiple:19.5, premium:0.28 },
  { name:"Illustrative Deal C (sponsor/PE buyout)",    evFcfMultiple:16.0, premium:0.24 },
];
function calculatePrecedentTransactions({ deals, targetFCF, targetNetDebt, sharesOut }) {
  return deals.map((d) => {
    const impliedEV = d.evFcfMultiple * targetFCF;
    const impliedEquity = impliedEV - targetNetDebt;
    const impliedPrice = sharesOut > 0 ? impliedEquity / sharesOut : null;
    return { ...d, impliedEV, impliedEquity, impliedPrice };
  });
}

// --- LBO ---
function calculateLBO({ entryFCF, entryMultiple, leverageMultiple, interestRate, holdYears = 5, exitMultiple, fcfGrowth, fcfSweepPct = 0.75 }) {
  const entryEV = entryMultiple * entryFCF;
  let debt = Math.min(leverageMultiple * entryFCF, entryEV * 0.85); // guardrail: cap leverage at 85% of EV
  const entryDebt = debt;
  const entryEquity = entryEV - entryDebt;
  let fcf = entryFCF;
  const schedule = [];
  for (let y = 1; y <= holdYears; y++) {
    fcf = fcf * (1 + fcfGrowth);
    const interest = debt * interestRate;
    const cashAvailable = Math.max(0, fcf - interest);
    const paydown = Math.min(debt, cashAvailable * fcfSweepPct);
    debt -= paydown;
    schedule.push({ year: y, fcf, interest, paydown, endingDebt: debt });
  }
  const exitFCF = fcf;
  const exitEV = exitMultiple * exitFCF;
  const exitDebt = debt;
  const exitEquity = exitEV - exitDebt;
  const moic = entryEquity > 0 ? exitEquity / entryEquity : null;
  const irr = moic != null && moic > 0 ? Math.pow(moic, 1 / holdYears) - 1 : null;
  return { entryEV, entryDebt, entryEquity, schedule, exitFCF, exitEV, exitDebt, exitEquity, moic, irr };
}

// --- Derived per-ticker fields (approximations — see skill doc) ---
// Shares outstanding in BILLIONS (marketCap and price are both raw dollars;
// fcf/netDebt are in $B throughout this engine, so this stays unit-consistent
// with everything it gets divided into — see calculateDCF/TradingMultiples).
// Prefers the real SEC EDGAR figure (sharesOutB, from
// dei:EntityCommonStockSharesOutstanding) once a Fundamentals pull has
// landed for this ticker; otherwise derives it from marketCap/price.
function impliedSharesOut(t){
  const u=UNIVERSE[t];
  if(u && u.sharesOutB!=null) return u.sharesOutB;
  return (u && u.marketCap && u.price) ? (u.marketCap/u.price)/1e9 : null;
}
// Net debt in $B. Real figure once a SEC EDGAR "Pull Fundamentals" run has
// populated netDebtB (fundamentalsSource==="sec-edgar"); otherwise falls back
// to the illustrative MOCK_NET_DEBT_B seed. Never derived from
// debtEquity x marketCap (see the comment on MOCK_NET_DEBT_B for why that
// combination is unsound). Falls back to 0 if neither is present (e.g. a
// newly imported ticker) rather than guessing.
function impliedNetDebt(t){ const u=UNIVERSE[t]; return (u && u.netDebtB!=null) ? u.netDebtB : 0; }
// Real EBITDA in $B from SEC EDGAR (Operating Income + D&A, both XBRL-tagged)
// — null unless a Fundamentals pull has resolved both components for this
// ticker. Used to upgrade Trading Multiples from the EV/FCF stand-in to a
// true EV/EBITDA basis; DCF/LBO stay FCF-based regardless (FCF is the one
// figure guaranteed present in both mock and real data).
function impliedEBITDA(t){ const u=UNIVERSE[t]; return u && u.ebitdaB!=null ? u.ebitdaB : null; }
function impliedEPS(t){ const u=UNIVERSE[t]; return u ? (u.eps || (u.pe ? u.price/u.pe : null)) : null; }
// FCF base for DCF/LBO/Multiples-fallback. Alpha Vantage's live "Full"
// refresh never populates fcf (needs CASH_FLOW, not wired in — same
// disclosed gap as debtEquity, see README) — so a ticker refreshed live via
// Alpha Vantage has NO usable fcf even though it has real price/marketCap
// data. If a SEC EDGAR Fundamentals pull has landed real EBITDA for this
// ticker, use that as a proxy (haircut for capex/taxes/working capital —
// clearly flagged via .approximated, never silently swapped in). Returns
// {value, approximated} rather than a bare number so callers can disclose it.
function impliedFCFBase(t){
  const u = UNIVERSE[t];
  if(!u) return { value:null, approximated:false };
  if(u.fcf!=null) return { value:u.fcf, approximated:false };
  if(u.ebitdaB!=null) return { value:u.ebitdaB*0.7, approximated:true }; // ~70% of EBITDA, standard rough FCF conversion rule-of-thumb
  return { value:null, approximated:false };
}

// --- Per-ticker assumption defaults + accessor (lazily populated into state.valuationAssumptions) ---
function defaultValuationAssumptions(t){
  const u = UNIVERSE[t];
  const beta = STOCK_BETA[t] ?? u.beta ?? 1;
  const debtWeight = u.debtEquity!=null ? u.debtEquity/(1+u.debtEquity) : 0.2;
  return {
    dcf: {
      nearTermGrowth: u.revGrowth!=null ? Math.min(u.revGrowth,0.35) : 0.08,
      terminalGrowth: 0.025,
      years: 5,
      waccMode: "capm", // "manual" | "capm"
      waccManual: 0.09,
      capm: { rf: RF, beta: Number(beta.toFixed(2)), erp: 0.055, kd: 0.05, tax: 0.21, debtWeight: Number(debtWeight.toFixed(2)) },
    },
    multiples: {
      peerSet: TICKERS.filter(x=>x!==t && UNIVERSE[x].assetClass!=="ETF" && UNIVERSE[x].group===u.group).slice(0,5),
    },
    lbo: {
      entryMultiple: 12,
      leverageMultiple: 5,
      interestRate: 0.08,
      holdYears: 5,
      exitMultiple: 12,
      fcfGrowth: u.revGrowth!=null ? Math.min(u.revGrowth,0.25) : 0.06,
      fcfSweepPct: 0.75,
    },
    precedent: {
      deals: MOCK_PRECEDENT_DEALS.map(d=>({...d})),
    },
  };
}
function getVA(t){
  if(!state.valuationAssumptions[t]) state.valuationAssumptions[t] = defaultValuationAssumptions(t);
  return state.valuationAssumptions[t];
}
function resolvedWACC(t){
  const d = getVA(t).dcf;
  if(d.waccMode==="manual") return d.waccManual;
  return calculateWACC({ rf:d.capm.rf, beta:d.capm.beta, erp:d.capm.erp, costOfDebtPretax:d.capm.kd, taxRate:d.capm.tax, debtWeight:d.capm.debtWeight }).wacc;
}
// Generic nested-path setter for assumption edits, e.g. setVAField("NVDA","dcf.capm.beta",1.1)
function setVAField(t, path, value){
  const va = getVA(t);
  const parts = path.split(".");
  let obj = va;
  for(let i=0;i<parts.length-1;i++) obj = obj[parts[i]];
  obj[parts[parts.length-1]] = value;
}

/* =========================================================================
   FORMATTERS
   ========================================================================= */
// HTML-escape any string before it goes into an innerHTML template literal.
// Defense in depth: server.js now rejects/sanitizes unsafe import fields at the
// source, but names/sectors can also come from Alpha Vantage (external data),
// so every non-numeric, potentially-external-or-imported string gets escaped
// at render time too rather than trusting upstream sanitization alone.
const escapeHtml = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
// Shown once, prominently, wherever a visitor is likely to first notice — not
// on every single view (the per-ticker "seeded" src-pill badge already
// discloses this consistently everywhere else). dataMeta.source is "seeded"
// (public/keyless deployment bootstrapped straight from the committed
// snapshot) or "mixed" (some tickers seeded, some regenerated as synthetic
// mock, e.g. a ticker outside the seed's default universe).
function seededDisclosureBanner(){
  if(dataMeta.source!=="seeded" && dataMeta.source!=="mixed") return "";
  const asOf = dataMeta.seededAt ? new Date(dataMeta.seededAt).toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"}) : "an earlier date";
  return `<div class="info-box" style="margin-bottom:14px;">This public demo doesn't call live APIs. Tickers marked <span class="src-pill seeded">seeded</span> show a real one-time data pull (Alpha Vantage + SEC EDGAR), frozen as of ${escapeHtml(asOf)} — <b>not live data</b>. Clone the repo and run it with your own API keys (see README) for a live feed.</div>`;
}
const fmtMoney = n => n==null ? "—" : "$"+Math.round(n).toLocaleString();
const fmtMoneyB = n => n==null ? "—" : "$"+n.toFixed(1)+"B";
const fmtPct = (n,d=2) => n==null ? "—" : (n>=0?"+":"")+(n*100).toFixed(d)+"%";
const fmtPlain = (n,d=1) => n==null ? "—" : (n*100).toFixed(d)+"%";
const fmtNum = (n,d=2) => n==null||isNaN(n) ? "—" : n.toFixed(d);
const cls = n => n>=0 ? "up" : "down";
const arrow = n => n>=0 ? "▲" : "▼";
function tagClass(tag){
  if(tag==="Bullish"||tag==="Cheap vs. history") return "bullish";
  if(tag==="Bearish"||tag==="Expensive vs. history") return "bearish";
  if(tag==="Fair vs. history") return "fair";
  return "neutral";
}

  importRows:null,

  stressScenario:"correction",
  includeExtras:false,    // opt-in dividends + news sentiment on refresh (+2 API calls/ticker)
  refreshMode:"full",     // "full" (price+fundamentals) or "price" (price only, ~half the cost)
};
const DIVIDENDS = {};      // ticker -> { history:[{exDate,payDate,amount}], lastRefreshed }
const NEWS_SENTIMENT = {}; // ticker -> { avgScore, articleCount, headlines:[...], lastRefreshed }
let MARKET_PULSE = null;   // { vixy:{series,price,lastRefreshed}, putCall:{ratioFullChain,byExpiration,lastRefreshed}, dataSource, lastRefreshed }
let chartRegistry={};
function destroyCharts(){ Object.values(chartRegistry).forEach(c=>c&&c.destroy()); chartRegistry={}; }
let MC_CACHE = null; // cached Monte Carlo fan series, keyed by a totalValue/annReturn/annVol signature

function getPositions(){
  return Object.keys(state.portfolio)
    .filter(t=>state.portfolio[t]>0 && UNIVERSE[t])
    .map(t=>{
      const s=UNIVERSE[t]; const shares=state.portfolio[t];
      const meta = POSITION_META[t] || { avgCost:s.price, currency:"USD", market:"US", purchaseDate:null };
      const price = s.price || meta.avgCost || 0;
      const fx = meta.currency==="USD" ? 1 : (FX_RATES[meta.currency] ?? null);
      const fxKnown = meta.currency==="USD" || fx!=null;
      const value = shares*price*(fx ?? 1);
      return {ticker:t,...s,shares,value,avgCost:meta.avgCost,currency:meta.currency,market:meta.market,purchaseDate:meta.purchaseDate,fxKnown};
    })
    .sort((a,b)=>b.value-a.value);
}
function getWeights(positions,totalValue){
  const w={}; positions.forEach(p=>w[p.ticker]=p.value/(totalValue||1)); return w;
}
function computeRisk(weights, totalValue){
  if(totalValue<=0 || Object.keys(weights).length===0) return null;
  const portRet = portfolioReturnsFn(weights, RETURNS);
  const annReturn = mean(portRet)*TRADING_DAYS_PER_YEAR;
  const annVol = stdev(portRet)*Math.sqrt(TRADING_DAYS_PER_YEAR);
  const sharpe = sharpeRatio(portRet, RF);
  const sortino = sortinoRatio(portRet, RF);
  const pBeta = portfolioBetaFn(weights, STOCK_BETA);
  const treynor = treynorRatio(portRet, RF, pBeta);
  const alpha = jensensAlpha(portRet, BENCH_RETURNS, RF, pBeta);
  const ir = informationRatio(portRet, BENCH_RETURNS);
  const rsq = rSquared(portRet, BENCH_RETURNS);
  const var1d = parametricVaR(totalValue, portRet, 0.95, 1);
  const var1m = parametricVaR(totalValue, portRet, 0.95, 21);
  const cvar1d = parametricCVaR(totalValue, portRet, 0.95, 1);
  const priceIdx = [1000]; portRet.forEach(r=>priceIdx.push(priceIdx[priceIdx.length-1]*(1+r)));
  const mdd = maxDrawdown(priceIdx);
  const h = hhi(weights), effN = effectiveN(weights);
  return { portRet, annReturn, annVol, sharpe, sortino, beta:pBeta, treynor, alpha, ir, rsq, var1d, var1m, cvar1d, mdd, hhi:h, effN };
}

function renderNav(){
  document.getElementById("navLinks").innerHTML = VIEWS.map(([k,l])=>
    `<div class="nav-link ${state.view===k?'active':''}" data-view="${k}">${l}</div>`).join("");
  document.querySelectorAll(".nav-link").forEach(el=>el.addEventListener("click",()=>{ state.view=el.dataset.view; render(); }));

  const statusEl = document.getElementById("dataStatus");
  const src = dataMeta.source || "mock";
  const asOf = dataMeta.lastRefreshed ? new Date(dataMeta.lastRefreshed).toLocaleString() : "never (using mock engine)";
  statusEl.innerHTML = `Data source: <b>${src}</b><br>As of: ${asOf}${serverAvailable?"":"<br><span style=\"color:#E5A94A;\">Local server not detected</span>"}`;
}
function renderTickerStrip(){
  document.getElementById("tickerStrip").innerHTML = CORE_TICKERS.map(t=>{
    const pf = PRICES_FULL[t];
    const chg = (pf[pf.length-1]-pf[pf.length-2])/pf[pf.length-2];
    return `<div class="ticker-item" data-open="${t}">
      <span class="ticker-sym">${t}</span>
      <span class="ticker-price">${UNIVERSE[t].price.toFixed(2)}</span>
      <span class="ticker-chg ${cls(chg)}">${arrow(chg)} ${fmtPlain(Math.abs(chg))}</span>
    </div>`;
  }).join("");
  document.querySelectorAll("[data-open]").forEach(el=>el.addEventListener("click",()=>{ state.selectedTicker=el.dataset.open; state.view="detail"; render(); }));
}
function render(){
  renderNav(); renderTickerStrip(); destroyCharts();
  const root=document.getElementById("viewRoot");
  if(state.view==="dashboard") root.innerHTML=viewDashboard();
  if(state.view==="detail") root.innerHTML=viewDetail(state.selectedTicker);
  if(state.view==="portfolio") root.innerHTML=viewPortfolio();
  if(state.view==="screener") root.innerHTML=viewScreener();
  if(state.view==="comparison") root.innerHTML=viewComparison();
  if(state.view==="valuation") root.innerHTML=viewValuation();
  if(state.view==="marketpulse") root.innerHTML=viewMarketPulse();
  renderModal(); renderRefreshModal(); renderImportModal();
  attachHandlers();
  drawCharts();
}

        <div class="stat-card"><div class="stat-label">EBITDA Margin</div><div class="stat-value small">${s.ebitdaMargin?fmtPlain(s.ebitdaMargin):"—"}</div><div class="stat-sub">${s.ebitdaMarginSource==="sec-edgar"?`EDGAR, as of ${escapeHtml(s.fundamentalsAsOf||"—")}`:"latest FY (mock)"}</div></div>
        <div class="stat-card"><div class="stat-label">Free Cash Flow</div><div class="stat-value small">${s.fcf?fmtMoneyB(s.fcf):"—"}</div><div class="stat-sub">${s.dataSource==="live"||s.dataSource==="seeded"?"needs CASH_FLOW call — not pulled":"TTM (mock)"}</div></div>
        <div class="stat-card"><div class="stat-label">Avg Daily Volume</div><div class="stat-value small">${fmtNum(s.avgVolume,1)}M</div><div class="stat-sub">${escapeHtml(s.assetClass)} · ${escapeHtml(s.sector)||"—"}</div></div>
        <div class="stat-card"><div class="stat-label">Revenue</div><div class="stat-value small">${s.revenueB!=null?fmtMoneyB(s.revenueB):"—"}</div><div class="stat-sub">${s.fundamentalsSource==="sec-edgar"?`EDGAR, as of ${escapeHtml(s.fundamentalsAsOf||"—")}`:"run Pull Fundamentals (SEC EDGAR)"}</div></div>
        <div class="stat-card"><div class="stat-label">EBITDA</div><div class="stat-value small">${s.ebitdaB!=null?fmtMoneyB(s.ebitdaB):"—"}</div><div class="stat-sub">${s.fundamentalsSource==="sec-edgar"?`EDGAR approx., as of ${escapeHtml(s.fundamentalsAsOf||"—")}`:"run Pull Fundamentals (SEC EDGAR)"}</div></div>
        <div class="stat-card"><div class="stat-label">Net Debt</div><div class="stat-value small">${s.netDebtB!=null?fmtMoneyB(s.netDebtB):"—"}</div><div class="stat-sub">${s.fundamentalsSource==="sec-edgar"?`EDGAR, as of ${escapeHtml(s.fundamentalsAsOf||"—")}`:"run Pull Fundamentals (SEC EDGAR)"}</div></div>
        <div class="stat-card"><div class="stat-label">Shares Out</div><div class="stat-value small">${s.sharesOutB!=null?fmtNum(s.sharesOutB,2)+"B":"—"}</div><div class="stat-sub">${s.fundamentalsSource==="sec-edgar"?`EDGAR, as of ${escapeHtml(s.fundamentalsAsOf||"—")}`:"run Pull Fundamentals (SEC EDGAR)"}</div></div>
      </div>
    </div>
    <div class="footnote">Jump to any ticker via the search bar on Dashboard, the selector above, the Screener, or a row in Portfolio &amp; Risk / Comparison. P/E percentile compares current P/E to a ${s.dataSource==="live"?"same-EPS implied historical series (real prices, approximated constant EPS)":"same-EPS implied historical series (mock)"} — see the technical-indicators skill for the real EARNINGS-based upgrade path. Revenue/EBITDA/Net Debt/Shares Out come from the SEC EDGAR "Pull Fundamentals" refresh (see Refresh Data), independent of the Alpha Vantage price/quote refresh.</div>
  </div>`;
}

/* =========================================================================
   VIEW: PORTFOLIO & RISK
   ========================================================================= */
function viewPortfolio(){
  const positions=getPositions();
  const totalValue=positions.reduce((a,p)=>a+p.value,0);
  const weights=getWeights(positions,totalValue);
  const risk=computeRisk(weights,totalValue);
  const dayChangeVal=positions.reduce((a,p)=>{ const pf=PRICES_FULL[p.ticker]; const chg=(pf[pf.length-1]-pf[pf.length-2])/pf[pf.length-2]; return a+p.value*chg; },0);
  const dayChangePct=totalValue>0?dayChangeVal/totalValue:0;

  const sectorMap={};
  positions.forEach(p=>{ const sec=p.sector||"Unknown"; sectorMap[sec]=(sectorMap[sec]||0)+p.value; });

  let flags = concentrationFlags(positions, weights).filter(f=>f.level!=="ok");
  flags = flags.concat(liquidityFlags(positions));
  if(flags.length===0) flags = [{ level:"ok", text:"No concentration, correlation, or liquidity flags at current thresholds." }];
  const empVar = risk ? empiricalVaR(totalValue, risk.portRet, 0.95) : null;
  const empCvar = risk ? empiricalCVaR(totalValue, risk.portRet, 0.95) : null;
  const scenario = STRESS_SCENARIOS.find(s=>s.key===state.stressScenario) || STRESS_SCENARIOS[0];
  const stress = risk ? scenarioImpact(positions, weights, totalValue, scenario.shock) : null;
  const styleGrid = styleBoxWeights(positions, weights);
  const sizes=["Large","Mid","Small"], styles=["Value","Blend","Growth"];

  return `
  <div class="topbar">
    <div>
      <div class="page-heading">Portfolio &amp; Risk</div>
      <div class="page-sub">${positions.length} positions · rf = 3M T-bill (4.3%) · benchmark ${BENCHMARK_NAME}</div>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="secondary-btn" id="openImportModal">⇪ Import Portfolio</button>
      <button class="primary-btn" id="openAddModal">+ Add Stock</button>
    </div>
  </div>
  <div class="content">
    <div>
      <div class="section-label">Risk Summary</div>
      <div class="summary-grid summary-grid-5">
        <div class="stat-card hero"><div class="stat-label">Total Value</div><div class="stat-value">${fmtMoney(totalValue)}</div><div class="stat-sub ${cls(dayChangeVal)}">${arrow(dayChangeVal)} ${fmtMoney(Math.abs(dayChangeVal))} (${fmtPct(dayChangePct)}) today</div></div>
        <div class="stat-card"><div class="stat-label">Sharpe / Sortino</div><div class="stat-value">${risk?`${fmtNum(risk.sharpe)} / ${fmtNum(risk.sortino)}`:"—"}</div><div class="stat-sub">rf = 4.3%</div></div>
        <div class="stat-card"><div class="stat-label">Beta / Treynor</div><div class="stat-value">${risk?`${fmtNum(risk.beta)} / ${fmtNum(risk.treynor)}`:"—"}</div><div class="stat-sub">Jensen's α ${risk?fmtPct(risk.alpha):"—"}</div></div>
        <div class="stat-card"><div class="stat-label">Info Ratio / R²</div><div class="stat-value">${risk?`${fmtNum(risk.ir)} / ${fmtNum(risk.rsq)}`:"—"}</div><div class="stat-sub">Ann. vol ${risk?fmtPlain(risk.annVol):"—"}</div></div>
        <div class="stat-card"><div class="stat-label">95% VaR (1-day)</div><div class="stat-value" style="color:var(--red);">${risk?"-"+fmtMoney(risk.var1d.value):"—"}</div><div class="stat-sub">-${risk?fmtPlain(risk.var1d.pct):"—"} of NAV</div></div>
      </div>
    </div>

    <div>
      <div class="section-label">Risk Flags — concentration &amp; correlation</div>
      <div class="flag-row">
        ${flags.map(f=>`<div class="flag flag-${f.level}">${f.text}</div>`).join("")}
      </div>
    </div>

    <div class="risk-grid">
      <div>
        <div class="section-label">Holdings &amp; Rebalancing <span style="font-weight:400;font-style:italic;color:var(--muted);text-transform:none;letter-spacing:0;">— set a target % to track drift</span></div>
        <div class="table-card">
          ${positions.length===0 ? `<div style="padding:24px;font-size:13px;color:var(--muted);">No positions yet. Click "+ Add Stock" to build a portfolio.</div>` : `
          <table>
            <thead><tr><th>Ticker</th><th>Market</th><th class="num">Shares</th><th class="num">Avg Cost</th><th class="num">Price</th><th class="num">Mkt Value (USD)</th><th class="num">Weight</th><th class="num">Unrealized G/L</th><th class="num">Target %</th><th class="num">Drift</th><th class="num">Day Chg</th><th class="num">Beta</th><th></th></tr></thead>
            <tbody>
            ${positions.map(p=>{
              const pf=PRICES_FULL[p.ticker]; const chg=(pf[pf.length-1]-pf[pf.length-2])/pf[pf.length-2];
              const ccyTag = p.currency && p.currency!=="USD" ? ` <span class="mono" style="font-size:9.5px;color:var(--muted);">${p.currency}${!p.fxKnown?" ⚠":""}</span>` : "";
              const pnl = unrealizedPnL(p.shares, p.avgCost, p.price);
              const targetPct = state.targetWeights[p.ticker];
              const targetInputVal = targetPct!=null ? (targetPct*100).toFixed(1) : "";
              const reb = rebalanceSuggestion(weights[p.ticker], targetPct, totalValue);
              const hasTarget = targetPct!=null;
              return `<tr>
                <td class="name-cell" data-open="${p.ticker}" style="cursor:pointer;"><span class="ticker-tag">${p.ticker}</span> <span class="src-pill ${p.dataSource}">${p.dataSource}</span><br><span class="co-name">${escapeHtml(p.name)}</span></td>
                <td><span class="sector-pill">${p.market||"US"}</span></td>
                <td class="num"><div class="stepper"><button data-step="${p.ticker}" data-delta="-10">−</button>${p.shares.toLocaleString()}<button data-step="${p.ticker}" data-delta="10">+</button></div></td>
                <td class="num">${p.avgCost!=null?p.avgCost.toFixed(2):"—"}${ccyTag}</td>
                <td class="num">${p.price!=null?p.price.toFixed(2):"—"}</td>
                <td class="num">${Math.round(p.value).toLocaleString()}</td>
                <td class="num">${fmtPlain(weights[p.ticker])}</td>
                <td class="num ${pnl.dollar!=null?cls(pnl.dollar):''}">${pnl.dollar!=null?fmtMoney(pnl.dollar)+" ("+fmtPct(pnl.pct)+")":"—"}</td>
                <td class="num"><input class="target-input" data-target="${p.ticker}" type="number" min="0" max="100" step="0.5" placeholder="—" value="${targetInputVal}"></td>
                <td class="num ${hasTarget?(Math.abs(reb.drift)>=0.03?'down':''):''}">${hasTarget?fmtPct(reb.drift):"—"}</td>
                <td class="num ${cls(chg)}">${fmtPct(chg)}</td>
                <td class="num">${fmtNum(STOCK_BETA[p.ticker])}</td>
                <td class="num"><button class="remove-btn" data-remove="${p.ticker}">✕</button></td>
              </tr>`;
            }).join("")}
            </tbody>
          </table>`}
        </div>
        <div class="footnote" style="margin-top:8px;">Weight = market value / total portfolio value. Unrealized G/L uses cost basis from manual entry or Excel import. Target % is optional per position — drift = current weight − target; |drift| ≥ 3% is flagged red. Non-USD positions convert at the last-fetched spot FX rate (⚠ = rate not yet available).</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div class="table-card" style="padding:18px;">
          <div class="section-label">Sector Allocation</div>
          <canvas id="chartSector" height="200"></canvas>
        </div>
        <div class="table-card" style="padding:18px;">
          <div class="section-label">Style Box <span style="font-weight:400;font-style:italic;color:var(--muted);text-transform:none;letter-spacing:0;">size × valuation tilt</span></div>
          <div style="display:grid;grid-template-columns:56px repeat(3,1fr);gap:4px;">
            <div></div>
            ${styles.map(st=>`<div class="mono" style="text-align:center;font-size:10px;color:var(--muted);">${st}</div>`).join("")}
            ${sizes.map(sz=>`
              <div class="mono" style="font-size:10px;color:var(--muted);align-self:center;">${sz}</div>
              ${styles.map(st=>{
                const w = styleGrid[`${sz}/${st}`]||0;
                const intensity = Math.min(0.85, 0.08+w*2.2);
                return `<div class="heat-cell" style="background:rgba(15,76,129,${intensity});">${w>0?fmtPlain(w,0):"—"}</div>`;
              }).join("")}
            `).join("")}
          </div>
          <div class="footnote" style="margin-top:8px;">Size from market cap (Large ≥$200B, Mid ≥$10B); style from P/E-vs-history percentile (cheap third = Value, expensive third = Growth). ETFs default to Mid/Blend.</div>
        </div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:14px;">
      <div class="stat-card">
        <div class="section-label" style="margin-bottom:10px;">Value at Risk, 95% — Parametric vs. Empirical</div>
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="color:var(--muted);font-size:12px;">1-day VaR (parametric)</span><span class="stat-value small" style="color:var(--red);">${risk?"-"+fmtMoney(risk.var1d.value):"—"}</span></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="color:var(--muted);font-size:12px;">1-day VaR (empirical)</span><span class="stat-value small" style="color:var(--red);">${empVar?"-"+fmtMoney(empVar.value):"—"}</span></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="color:var(--muted);font-size:12px;">1-day CVaR (parametric)</span><span class="stat-value small" style="color:var(--red);">${risk?"-"+fmtMoney(risk.cvar1d.value):"—"}</span></div>
        <div style="display:flex;justify-content:space-between;"><span style="color:var(--muted);font-size:12px;">1-day CVaR (empirical)</span><span class="stat-value small" style="color:var(--red);">${empCvar?"-"+fmtMoney(empCvar.value):"—"}</span></div>
        <div class="footnote" style="margin-top:10px;">Parametric assumes normal returns; empirical (historical-simulation) sorts the actual trailing ${RISK_WINDOW}-day returns and reads the 5th percentile directly — no distribution assumption, but noisier with a short window.</div>
      </div>
      <div class="stat-card">
        <div class="section-label" style="margin-bottom:10px;">Diversification</div>
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="color:var(--muted);font-size:12px;">HHI</span><span class="stat-value small">${risk?fmtNum(risk.hhi,3):"—"}</span></div>
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;"><span style="color:var(--muted);font-size:12px;">Effective N</span><span class="stat-value small">${risk?fmtNum(risk.effN,1):"—"}</span></div>
        <div style="display:flex;justify-content:space-between;"><span style="color:var(--muted);font-size:12px;">Max Drawdown</span><span class="stat-value small" style="color:var(--red);">${risk?fmtPct(risk.mdd):"—"}</span></div>
        <div class="footnote" style="margin-top:10px;">Effective N of ${risk?fmtNum(risk.effN,1):"—"} vs. ${positions.length} actual holdings ${risk && risk.effN < positions.length*0.7 ? "indicates meaningful concentration.":"is reasonably close to even weighting."}</div>
      </div>
      <div class="stat-card">
        <div class="section-label" style="margin-bottom:10px;">Correlation Matrix (daily returns, ${RISK_WINDOW}d)</div>
        <div id="corrMatrix"></div>
      </div>
    </div>

    <div class="risk-grid">
      <div class="table-card" style="padding:20px;">
        <div class="section-label">Scenario Stress Test <span style="font-weight:400;font-style:italic;color:var(--muted);text-transform:none;letter-spacing:0;">factor-based: shocks the benchmark, propagates via each position's beta</span></div>
        <select id="scenarioSelect" class="mono" style="padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);margin-bottom:14px;">
          ${STRESS_SCENARIOS.map(s=>`<option value="${s.key}" ${s.key===scenario.key?'selected':''}>${s.label}</option>`).join("")}
        </select>
        ${stress ? `
        <div style="display:flex;gap:18px;margin-bottom:14px;">
          <div><div class="stat-label">Portfolio Impact</div><div class="stat-value ${cls(stress.deltaValue)}">${fmtMoney(stress.deltaValue)} (${fmtPct(stress.pctImpact)})</div></div>
          <div><div class="stat-label">Value After Shock</div><div class="stat-value small">${fmtMoney(stress.newValue)}</div></div>
        </div>
        <div style="max-height:180px;overflow-y:auto;">
          <table><thead><tr><th>Ticker</th><th class="num">Beta</th><th class="num">Scenario Return</th><th class="num">Δ Value</th></tr></thead>
          <tbody>${stress.byPosition.map(b=>`<tr><td class="ticker-tag">${b.ticker}</td><td class="num">${fmtNum(b.beta)}</td><td class="num ${cls(b.posReturn)}">${fmtPct(b.posReturn)}</td><td class="num ${cls(b.posDelta)}">${fmtMoney(b.posDelta)}</td></tr>`).join("")}</tbody></table>
        </div>
        <div class="footnote" style="margin-top:10px;">Standard factor-based stress testing simplification: overrides normal covariance assumptions with one deterministic market move, applied through each position's own beta. Idiosyncratic (stock-specific) risk isn't modeled in a scenario shock.</div>` : `<div class="footnote">No positions to stress test.</div>`}
      </div>
      <div class="table-card" style="padding:20px;">
        <div class="section-label">Monte Carlo Projection <span style="font-weight:400;font-style:italic;color:var(--muted);text-transform:none;letter-spacing:0;">1-year, geometric Brownian motion, 300 paths</span></div>
        <canvas id="chartMonteCarlo" height="200"></canvas>
        <div id="mcReadout" style="display:flex;gap:18px;margin-top:12px;"></div>
        <div class="footnote" style="margin-top:10px;">Simulated using the portfolio's own trailing annualized return &amp; volatility (${risk?fmtPct(risk.annReturn):"—"} / ${risk?fmtPlain(risk.annVol):"—"}) as the GBM drift/vol inputs — a projection of what the recent regime implies going forward, not a guarantee.</div>
      </div>
    </div>

    <div class="risk-grid">
      <div class="table-card" style="padding:20px;">
        <div class="section-label">Dividend Income Projection</div>
        ${(()=>{ const inc=portfolioDividendIncome(positions); return `
        <div style="display:flex;gap:18px;margin-bottom:14px;">
          <div><div class="stat-label">Est. Annual Income</div><div class="stat-value">${fmtMoney(inc.annualIncome)}</div></div>
          <div><div class="stat-label">Portfolio Yield</div><div class="stat-value small">${totalValue>0?fmtPlain(inc.annualIncome/totalValue):"—"}</div></div>
        </div>
        ${inc.rows.length===0 ? `<div class="footnote">No dividend-paying positions detected.</div>` : `
        <table><thead><tr><th>Ticker</th><th class="num">Per Share (TTM)</th><th class="num">Annual Income</th><th>Source</th></tr></thead>
        <tbody>${inc.rows.map(r=>`<tr><td class="ticker-tag">${r.ticker}</td><td class="num">${fmtNum(r.perShare,2)}</td><td class="num">${fmtMoney(r.income)}</td><td><span class="src-pill ${r.source==='history'?'live':'mock'}">${r.source==='history'?'DIVIDENDS':'yield est.'}</span></td></tr>`).join("")}</tbody></table>`}
        <div class="footnote" style="margin-top:10px;">Prefers real trailing-12-month dividend history (Alpha Vantage <code>DIVIDENDS</code>, opt-in on refresh — zero extra cost beyond the 1 call/ticker); falls back to current yield × price when history hasn't been fetched yet.</div>`; })()}
      </div>
      <div class="table-card" style="padding:20px;">
        <div class="section-label">News Sentiment Snapshot</div>
        ${(()=>{
          const withSentiment = positions.filter(p=>NEWS_SENTIMENT[p.ticker]);
          if(withSentiment.length===0) return `<div class="footnote">No news sentiment data yet — enable "Include dividends + news sentiment" on your next refresh (Alpha Vantage <code>NEWS_SENTIMENT</code>, +1 call/ticker).</div>`;
          return `<table><thead><tr><th>Ticker</th><th class="num">Avg Sentiment</th><th class="num">Articles</th></tr></thead>
          <tbody>${withSentiment.map(p=>{ const ns=NEWS_SENTIMENT[p.ticker]; const s=ns.avgScore; const tag = s==null?"neutral":s>=0.15?"bullish":s<=-0.15?"bearish":"neutral"; return `<tr><td class="name-cell" data-open="${p.ticker}" style="cursor:pointer;"><span class="ticker-tag">${p.ticker}</span></td><td class="num"><span class="tag-pill ${tag}">${s!=null?fmtNum(s,3):"—"}</span></td><td class="num">${ns.articleCount}</td></tr>`; }).join("")}</tbody></table>
          <div class="footnote" style="margin-top:10px;">Relevance-weighted average sentiment score across recent headlines, -1 (very bearish) to +1 (very bullish). Full headline list is on each ticker's Stock Detail page.</div>`;
        })()}
      </div>
    </div>
  </div>`;
}

const SCREENER_COLS = [
  { key:"ticker", label:"Ticker" },
  { key:"price", label:"Price", num:true },
  { key:"roc20", label:"20D RoC", num:true },
  { key:"roc60", label:"60D RoC", num:true },
  { key:"rsi", label:"RSI(14)", num:true },
  { key:"trend", label:"Trend" },
  { key:"pe", label:"P/E", num:true },
  { key:"pePctl", label:"P/E Pctl", num:true },
  { key:"valuation", label:"Valuation" },
  { key:"momentum", label:"Momentum", num:true },
  { key:"score", label:"Score", num:true },
];
function screenerRows(){
  return TICKERS.map(t=>({
    ticker:t, price:UNIVERSE[t].price, roc20:STOCK_ROC20[t], roc60:STOCK_ROC60[t],
    rsi:STOCK_RSI[t], trend:STOCK_TREND[t], pe:UNIVERSE[t].pe, pePctl:STOCK_PE_PCTL[t],
    valuation:STOCK_VAL_TAG[t], momentum:STOCK_MOM[t], score:compositeScore(t), dataSource:UNIVERSE[t].dataSource, name:UNIVERSE[t].name,
  }));
}
function viewScreener(){
  let rows = screenerRows();
  const { col, dir } = state.screenerSort;
  rows.sort((a,b)=>{
    let va=a[col], vb=b[col];
    if(typeof va==="string") va = va||""; if(typeof vb==="string") vb = vb||"";
    if(va==null) return 1; if(vb==null) return -1;
    if(va<vb) return dir==="asc"?-1:1;
    if(va>vb) return dir==="asc"?1:-1;
    return 0;
  });
  return `
  <div class="topbar">
    <div><div class="page-heading">Screener</div><div class="page-sub">Momentum, trend &amp; valuation-vs-own-history across the universe. Click a header to sort.</div></div>
  </div>
  <div class="content">
    <div class="table-card">
      <table>
        <thead><tr>
          ${SCREENER_COLS.map(c=>`<th class="${c.num?'num':''} sortable" data-sort="${c.key}">${c.label}${col===c.key?(dir==="asc"?" ▲":" ▼"):""}</th>`).join("")}
        </tr></thead>
        <tbody>
        ${rows.map(r=>`
          <tr>
            <td class="name-cell" data-open="${r.ticker}" style="cursor:pointer;"><span class="ticker-tag">${r.ticker}</span> <span class="src-pill ${r.dataSource}">${r.dataSource}</span><br><span class="co-name">${escapeHtml(r.name)}</span></td>
            <td class="num">${fmtNum(r.price,2)}</td>
            <td class="num ${r.roc20!=null?cls(r.roc20):''}">${fmtPct(r.roc20)}</td>
            <td class="num ${r.roc60!=null?cls(r.roc60):''}">${fmtPct(r.roc60)}</td>
            <td class="num">${fmtNum(r.rsi,1)}</td>
            <td><span class="tag-pill ${tagClass(r.trend)}">${r.trend}</span></td>
            <td class="num">${fmtNum(r.pe,1)}</td>
            <td class="num">${r.pePctl!=null?fmtPlain(r.pePctl,0):"—"}</td>
            <td><span class="tag-pill ${tagClass(r.valuation)}">${r.valuation}</span></td>
            <td class="num">${fmtNum(r.momentum,3)}</td>
            <td class="num"><span class="score-badge ${scoreClass(r.score)}">${r.score ?? "—"}</span></td>
          </tr>`).join("")}
        </tbody>
      </table>
    </div>
    <div class="footnote">
      RoC = rate of change (price momentum) over the trailing window, computed from each ticker's full available history (up to ${MOCK_DAYS} sessions mock / ~100 live).
      Trend = SMA20 vs. SMA50 crossover relative to price. Momentum score is a heuristic blend of 20d/60d RoC and RSI distance from neutral — a ranking aid, not a formal factor model.
      P/E percentile compares current P/E to an implied historical series (price ÷ assumed-constant EPS) — an approximation until real trailing-EPS history (Alpha Vantage EARNINGS endpoint) is wired in.
      Score blends valuation (30%), momentum (30%), ROE quality (20%), and revenue growth (20%) into one 0–100 signal — a ranking aid similar to Simply Wall St's Snowflake or Seeking Alpha's Quant Rating, not investment advice.
    </div>
  </div>`;
}

/* =========================================================================

function viewValuation(){
  const t = state.valuationTicker;
  const u = UNIVERSE[t];
  const method = state.valuationMethod;
  const equityTickers = TICKERS.filter(x=>UNIVERSE[x].assetClass!=="ETF");
  const methodTabs = [["dcf","DCF"],["multiples","Trading Multiples"],["precedent","Precedent Transactions"],["lbo","LBO"]];

  let body = "";
  const fcfBase = u ? impliedFCFBase(t) : { value:null, approximated:false };
  if(!u || u.assetClass==="ETF"){
    body = `<div class="warn-box">ETFs don't have a standalone DCF/comps/LBO valuation — pick a single-name equity from the selector above.</div>`;
  } else if(u.marketCap==null || fcfBase.value==null){
    body = `<div class="warn-box">${t} is missing market cap or a usable FCF/EBITDA figure (data source: ${u.dataSource||"pending"}) — run a Full refresh (Alpha Vantage) for market cap, or Pull Fundamentals (SEC EDGAR) for EBITDA, before valuing it.</div>`;
  } else {
    const va = getVA(t);
    const eps = impliedEPS(t);
    const netDebt = impliedNetDebt(t);
    const sharesOut = impliedSharesOut(t);
    const fcfNote = fcfBase.approximated ? `<div class="warn-box">FCF isn't available for ${t} (Alpha Vantage's live refresh doesn't pull it — needs CASH_FLOW, not wired in). Using ~70% of real SEC EDGAR EBITDA as a rough stand-in instead — a standard rule-of-thumb conversion, not real FCF. Treat outputs below as more approximate than usual.</div>` : "";
    if(method==="dcf") body = fcfNote + renderDCFPanel(t, u, va, fcfBase);
    else if(method==="multiples") body = renderMultiplesPanel(t, u, va, eps, netDebt, sharesOut, equityTickers, fcfBase);
    else if(method==="lbo") body = fcfNote + renderLBOPanel(t, u, va, fcfBase);
    else if(method==="precedent") body = fcfNote + renderPrecedentPanel(va, netDebt, sharesOut, fcfBase);
  }

  const hasRealFundamentals = !!(u && u.fundamentalsSource==="sec-edgar");
  return `
  <div class="topbar">
    <div>
      <div class="page-heading">Valuation ${u && u.assetClass!=="ETF" ? `<span class="src-pill ${hasRealFundamentals?'live':'mock'}" title="${hasRealFundamentals?`Real fundamentals from SEC EDGAR${u.fundamentalsAsOf?`, as of ${escapeHtml(u.fundamentalsAsOf)}`:''}`:'Illustrative mock fundamentals — run Refresh Data → Pull Fundamentals for real figures'}">${hasRealFundamentals?'EDGAR':'illustrative'}</span>` : ""}</div>
      <div class="page-sub">DCF · Trading Multiples · Precedent Transactions · LBO — one consistent FCF-based data model across all four</div>
    </div>
    <select id="valuationSelect" class="mono" style="padding:8px 10px;border:1px solid var(--border);border-radius:7px;background:var(--surface);">
      ${equityTickers.map(x=>`<option value="${x}" ${x===t?'selected':''}>${x} — ${escapeHtml(UNIVERSE[x].name)}</option>`).join("")}
    </select>
  </div>
  <div class="content">
    ${seededDisclosureBanner()}
    <div class="chip-row">
      ${methodTabs.map(([k,l])=>`<div class="chip ${method===k?'chip-active':''}" data-vmethod="${k}">${l}</div>`).join("")}
    </div>
    ${body}
    <div class="footnote">${hasRealFundamentals
      ? `Net debt, EBITDA, and shares outstanding for ${t} are real figures from SEC EDGAR (Refresh Data → Pull Fundamentals)${u.fundamentalsAsOf?`, as of ${escapeHtml(u.fundamentalsAsOf)} (${escapeHtml(u.fundamentalsForm||"a filing")})`:""}. Full formula reference: equitylens-valuation skill.`
      : `Every method here runs off FCF and market cap (already in the data model) rather than revenue/EBITDA in dollars — EV/EBITDA-style multiples are approximated as EV/FCF instead, and net debt is an illustrative mock figure (MOCK_NET_DEBT_B). Run Refresh Data → Pull Fundamentals (free, SEC EDGAR, no daily cap) to replace these with real figures for ${t}. Full formula reference and live-data upgrade path: equitylens-valuation skill.`}</div>
  </div>`;
}

function renderDCFPanel(t, u, va, fcfBaseObj){
  const fcfBase = fcfBaseObj.value;
  const d = va.dcf;
  const wacc = resolvedWACC(t);
  const waccInfo = d.waccMode==="capm" ? calculateWACC({ rf:d.capm.rf, beta:d.capm.beta, erp:d.capm.erp, costOfDebtPretax:d.capm.kd, taxRate:d.capm.tax, debtWeight:d.capm.debtWeight }) : null;
  const validWacc = wacc!=null && wacc>d.terminalGrowth;
  const netDebt = impliedNetDebt(t), sharesOut = impliedSharesOut(t);
  const result = validWacc ? calculateDCF({ fcfBase, nearTermGrowth:d.nearTermGrowth, terminalGrowth:d.terminalGrowth, years:d.years, wacc, netDebt, sharesOut }) : null;
  const grid = validWacc ? dcfSensitivity({ fcfBase, nearTermGrowth:d.nearTermGrowth, terminalGrowth:d.terminalGrowth, years:d.years, wacc, netDebt, sharesOut }) : null;
  const upside = result && result.impliedSharePrice!=null ? (result.impliedSharePrice-u.price)/u.price : null;

  return `
  <div class="detail-grid">
    <div class="table-card" style="padding:20px;">
      <div class="section-label">Assumptions</div>
      <div class="val-form">
        <div class="val-row"><label>Near-term FCF growth (Yr 1)</label><span class="val-pct">% <input class="val-input" type="number" step="0.5" data-vfield="dcf.nearTermGrowth" data-vunit="pct" value="${(d.nearTermGrowth*100).toFixed(1)}"></span></div>
        <div class="val-row"><label>Terminal growth</label><span class="val-pct">% <input class="val-input" type="number" step="0.25" data-vfield="dcf.terminalGrowth" data-vunit="pct" value="${(d.terminalGrowth*100).toFixed(2)}"></span></div>
        <div class="val-row"><label>Projection years</label><input class="val-input" type="number" step="1" min="3" max="10" data-vfield="dcf.years" value="${d.years}"></div>
        <div class="val-row"><label>Starting FCF (base year)</label><span class="mono">${fmtMoneyB(fcfBase)}</span></div>
        <div class="val-divider"></div>
        <div class="section-label" style="margin-bottom:2px;">Discount Rate (WACC)</div>
        <div class="radio-row">
          <div class="radio-opt ${d.waccMode==='manual'?'selected':''}" data-vwaccmode="manual">I'll enter my own WACC</div>
          <div class="radio-opt ${d.waccMode==='capm'?'selected':''}" data-vwaccmode="capm">Help me calculate it (CAPM)</div>
        </div>
        ${d.waccMode==="manual" ? `
        <div class="val-row"><label>WACC</label><span class="val-pct">% <input class="val-input" type="number" step="0.1" data-vfield="dcf.waccManual" data-vunit="pct" value="${(d.waccManual*100).toFixed(1)}"></span></div>
        ` : `
        <div class="val-row"><label>Risk-free rate</label><span class="val-pct">% <input class="val-input" type="number" step="0.1" data-vfield="dcf.capm.rf" data-vunit="pct" value="${(d.capm.rf*100).toFixed(1)}"></span></div>
        <div class="val-row"><label>Beta</label><input class="val-input" type="number" step="0.05" data-vfield="dcf.capm.beta" value="${d.capm.beta.toFixed(2)}"></div>
        <div class="val-row"><label>Equity risk premium</label><span class="val-pct">% <input class="val-input" type="number" step="0.1" data-vfield="dcf.capm.erp" data-vunit="pct" value="${(d.capm.erp*100).toFixed(1)}"></span></div>
        <div class="val-row"><label>Pre-tax cost of debt</label><span class="val-pct">% <input class="val-input" type="number" step="0.1" data-vfield="dcf.capm.kd" data-vunit="pct" value="${(d.capm.kd*100).toFixed(1)}"></span></div>
        <div class="val-row"><label>Tax rate</label><span class="val-pct">% <input class="val-input" type="number" step="1" data-vfield="dcf.capm.tax" data-vunit="pct" value="${(d.capm.tax*100).toFixed(1)}"></span></div>
        <div class="val-row"><label>Debt weight, D/(D+E)</label><span class="val-pct">% <input class="val-input" type="number" step="1" data-vfield="dcf.capm.debtWeight" data-vunit="pct" value="${(d.capm.debtWeight*100).toFixed(1)}"></span></div>
        <div class="val-divider"></div>
        <div class="val-row"><label>Cost of equity</label><span class="mono">${fmtPlain(waccInfo.costOfEquity)}</span></div>
        <div class="val-row"><label>After-tax cost of debt</label><span class="mono">${fmtPlain(waccInfo.costOfDebtAfterTax)}</span></div>
        `}
        <div class="val-row" style="border-top:1px solid var(--border);padding-top:8px;margin-top:2px;"><label style="font-weight:600;color:var(--text);">WACC used in DCF</label><span class="mono" style="font-weight:700;">${wacc!=null?fmtPlain(wacc):"—"}</span></div>
        ${!validWacc?`<div class="warn-box">WACC must be greater than the terminal growth rate, or the terminal value is undefined — adjust one of the two above.</div>`:""}
      </div>
    </div>
    <div class="table-card" style="padding:20px;">
      <div class="section-label">Implied Value</div>
      ${result ? `
      <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:2px;">
        <div class="val-output-big">$${result.impliedSharePrice.toFixed(2)}</div>
        <div class="mono ${cls(upside)}" style="font-size:13px;">${arrow(upside)} ${fmtPct(Math.abs(upside))} vs. current $${u.price.toFixed(2)}</div>
      </div>
      <div class="stat-sub" style="margin-bottom:14px;">Implied share price</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;">
        <div><div class="stat-label">Enterprise Value</div><div class="stat-value small">${fmtMoneyB(result.enterpriseValue)}</div></div>
        <div><div class="stat-label">Equity Value</div><div class="stat-value small">${fmtMoneyB(result.equityValue)}</div></div>
        <div><div class="stat-label">PV of Terminal Value</div><div class="stat-value small">${fmtMoneyB(result.pvTerminalValue)}</div></div>
        <div><div class="stat-label">TV % of EV</div><div class="stat-value small">${fmtPlain(result.pvOfTerminalPct)}</div></div>
      </div>
      <div class="section-label" style="margin-top:16px;">FCF Projection</div>
      <table><thead><tr><th>Year</th><th class="num">Growth</th><th class="num">FCF</th><th class="num">PV</th></tr></thead>
      <tbody>${result.rows.map(r=>`<tr><td>${r.year}</td><td class="num">${fmtPlain(r.growth)}</td><td class="num">${fmtMoneyB(r.fcf)}</td><td class="num">${fmtMoneyB(r.pv)}</td></tr>`).join("")}</tbody></table>
      <div class="section-label" style="margin-top:16px;">Sensitivity — Implied Share Price (WACC × Terminal Growth)</div>
      <table><thead><tr><th></th>${[d.terminalGrowth-0.005,d.terminalGrowth,d.terminalGrowth+0.005].map(tg=>`<th class="num">g=${fmtPlain(tg,2)}</th>`).join("")}</tr></thead>
      <tbody>${[wacc-0.01,wacc,wacc+0.01].map((w,i)=>`<tr><td class="mono">WACC ${fmtPlain(w)}</td>${grid[i].map(v=>`<td class="num">${v!=null?"$"+v.toFixed(2):"—"}</td>`).join("")}</tr>`).join("")}</tbody></table>
      ` : `<div class="warn-box">Fix the WACC/terminal growth relationship above to see implied value.</div>`}
    </div>
  </div>`;
}

function renderMultiplesPanel(t, u, va, eps, netDebt, sharesOut, equityTickers, fcfBaseObj){
  const peers = va.multiples.peerSet.filter(x=>x!==t && UNIVERSE[x]);
  // Use a true EV/EBITDA basis once the TARGET has real SEC EDGAR EBITDA —
  // otherwise the whole table stays on the universally-available EV/FCF
  // stand-in. Deliberately a single basis for the whole comparison (not
  // per-peer) so the peer median isn't averaging EV/EBITDA against EV/FCF
  // for different peers, which wouldn't be a coherent multiple.
  const useEbitda = impliedEBITDA(t)!=null;
  const targetBasis = useEbitda ? impliedEBITDA(t) : fcfBaseObj.value;
  const basisLabel = useEbitda ? "EBITDA" : "FCF*";
  const peerRows = peers.map(x=>{
    const pu = UNIVERSE[x];
    const pNetDebt = impliedNetDebt(x); // $B
    const pMarketCapB = pu.marketCap!=null ? pu.marketCap/1e9 : null; // marketCap is raw $, convert to $B to match FCF/netDebt/EBITDA units
    const pBasis = useEbitda ? impliedEBITDA(x) : impliedFCFBase(x).value;
    const evMultiple = (pMarketCapB!=null && pBasis) ? (pMarketCapB+pNetDebt)/pBasis : null;
    return { ticker:x, pe:pu.pe, evMultiple, missingBasis: useEbitda && impliedEBITDA(x)==null };
  });
  const peerPE = peerMedian(peerRows.map(r=>r.pe));
  const peerEVMultiple = peerMedian(peerRows.map(r=>r.evMultiple));
  const result = calculateTradingMultiples({ peerPE, peerEVFCF:peerEVMultiple, targetEPS:eps, targetFCF:targetBasis, targetNetDebt:netDebt, sharesOut });
  const upsidePE = result.impliedPrice_PE!=null ? (result.impliedPrice_PE-u.price)/u.price : null;
  const upsideEVFCF = result.impliedPrice_EVFCF!=null ? (result.impliedPrice_EVFCF-u.price)/u.price : null;

  return `
  <div>
    <div class="section-label">Peer Set <span style="font-weight:400;font-style:italic;color:var(--muted);text-transform:none;letter-spacing:0;">— click to add/remove</span></div>
    <div class="chip-row">${equityTickers.filter(x=>x!==t).map(x=>`<div class="chip ${va.multiples.peerSet.includes(x)?'chip-active':''}" data-vpeer="${x}">${x}</div>`).join("")}</div>
  </div>
  <div class="detail-grid">
    <div class="table-card">
      <table><thead><tr><th>Ticker</th><th class="num">P/E</th><th class="num">EV / ${basisLabel}</th></tr></thead>
      <tbody>
      ${peerRows.length===0?`<tr><td colspan="3" style="padding:16px;color:var(--muted);">Select at least one peer above.</td></tr>`:peerRows.map(r=>`<tr><td class="name-cell"><span class="ticker-tag">${r.ticker}</span></td><td class="num">${fmtNum(r.pe,1)}</td><td class="num">${r.missingBasis?`<span style="color:var(--muted);font-style:italic;">no EBITDA yet</span>`:fmtNum(r.evMultiple,1)}</td></tr>`).join("")}
      <tr style="font-weight:600;background:var(--surface-2);"><td>Peer median</td><td class="num">${fmtNum(peerPE,1)}</td><td class="num">${fmtNum(peerEVMultiple,1)}</td></tr>
      </tbody></table>
    </div>
    <div class="table-card" style="padding:20px;">
      <div class="section-label">Implied Value — ${t} <span class="src-pill ${useEbitda?'live':'mock'}">${useEbitda?'EDGAR':'FCF stand-in'}</span></div>
      <div style="display:flex;flex-direction:column;gap:14px;">
        <div>
          <div class="stat-label">Peer median P/E × ${t} EPS (${fmtNum(eps,2)})</div>
          <div style="display:flex;align-items:baseline;gap:10px;"><div class="val-output-big">${result.impliedPrice_PE!=null?"$"+result.impliedPrice_PE.toFixed(2):"—"}</div>${upsidePE!=null?`<span class="mono ${cls(upsidePE)}">${arrow(upsidePE)} ${fmtPct(Math.abs(upsidePE))}</span>`:""}</div>
        </div>
        <div style="border-top:1px solid var(--border);padding-top:12px;">
          <div class="stat-label">Peer median EV/${basisLabel} × ${t} ${basisLabel} (${fmtMoneyB(targetBasis)})</div>
          <div style="display:flex;align-items:baseline;gap:10px;"><div class="val-output-big">${result.impliedPrice_EVFCF!=null?"$"+result.impliedPrice_EVFCF.toFixed(2):"—"}</div>${upsideEVFCF!=null?`<span class="mono ${cls(upsideEVFCF)}">${arrow(upsideEVFCF)} ${fmtPct(Math.abs(upsideEVFCF))}</span>`:""}</div>
        </div>
      </div>
    </div>
  </div>
  <div class="footnote">${useEbitda
    ? `EV/EBITDA is computed from real SEC EDGAR fundamentals for ${t} (Operating Income + D&A). Peers marked "no EBITDA yet" haven't had a Fundamentals pull run for them, so they're excluded from the median rather than mixed in on a different basis (FCF) — run Pull Fundamentals on more peers to include them.`
    : `*EV/FCF stands in for EV/EBITDA — ${t} doesn't have real EBITDA yet (Refresh Data → Pull Fundamentals to get it from SEC EDGAR). FCF is a cash-flow-based multiple too, so the substitution is directionally consistent, not a perfect match.`}</div>`;
}

function renderLBOPanel(t, u, va, fcfBaseObj){
  const l = va.lbo;
  const result = calculateLBO({ entryFCF:fcfBaseObj.value, entryMultiple:l.entryMultiple, leverageMultiple:l.leverageMultiple, interestRate:l.interestRate, holdYears:l.holdYears, exitMultiple:l.exitMultiple, fcfGrowth:l.fcfGrowth, fcfSweepPct:l.fcfSweepPct });
  return `
  <div class="detail-grid">
    <div class="table-card" style="padding:20px;">
      <div class="section-label">Deal Assumptions</div>
      <div class="val-form">
        <div class="val-row"><label>Entry multiple (x FCF)</label><input class="val-input" type="number" step="0.5" data-vfield="lbo.entryMultiple" value="${l.entryMultiple}"></div>
        <div class="val-row"><label>Leverage (Debt / FCF)</label><input class="val-input" type="number" step="0.5" data-vfield="lbo.leverageMultiple" value="${l.leverageMultiple}"></div>
        <div class="val-row"><label>Interest rate on debt</label><span class="val-pct">% <input class="val-input" type="number" step="0.25" data-vfield="lbo.interestRate" data-vunit="pct" value="${(l.interestRate*100).toFixed(2)}"></span></div>
